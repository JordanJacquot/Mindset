<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindset</title>
<link rel="stylesheet" href="coquille.css">
<link rel="stylesheet" href="ecrans/ecrans.css">
</head>
<body>
<!--
  La coquille de Mindset : les zones de la fenêtre WPF (interface.xaml), que le bloc « écrans » remplit à l'identique.
  Les id des zones et les quatre scripts ci-dessous font partie du contrat (architecture-mindset-rust.md) : le bloc
  « écrans » peut tout changer dans les zones, pas les retirer ni les renommer.
-->
<div id="fenetre">
  <div id="fond" aria-hidden="true"></div>
  <header id="en-tete"></header>
  <div id="corps">
    <nav id="colonne-onglets" aria-label="Applis"></nav>
    <div id="centre">
      <div id="bandeaux"></div>
      <main id="page-centrale">
        <section id="page-console" class="page" hidden></section>
        <section id="page-accueil" class="page"></section>
        <section id="page-appli" class="page" hidden><div id="zone-appli"></div></section>
        <section id="page-parametres" class="page" hidden></section>
      </main>
    </div>
  </div>
  <footer id="pied" aria-hidden="true"></footer>
  <div id="voile-fermeture" class="voile" hidden></div>
  <div id="voile-confirmation" class="voile" hidden></div>
</div>
<script src="ipc.js"></script>
<script src="coquille.js"></script>
<script src="ecrans/ecrans.js"></script>
<script src="console/console.js"></script>
</body>
</html>
