[package]
name = "mindset-parametres"
version = "0.1.0"
description = "Mindset en Rust, bloc « paramètres » : les panneaux des Paramètres, les thèmes de la suite, les packs (parametres.ps1, themes.ps1, packs.ps1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mindset-noyau = { path = "../mindset-noyau" }
# Les thèmes intégrés, la lecture des packs et la traduction des couleurs (themes), les lectures « à la PowerShell »
suite-commun = { path = "../suite-commun" }
# Versions figées (« = ») : les mêmes que Nevermind (D:\Projets\Nevermind\rust\Cargo.lock) et que le reste du dépôt.
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# L'import d'un thème de la suite (.zip) : la même version et les mêmes options que suite-commun (rien de nouveau)
zip = { version = "=9.1.2", default-features = false, features = ["deflate"] }

# Le seul module qui parle à Windows (src\windows) : la fenêtre « ouvrir un fichier » (Importer un thème), les noms des
# micros et des sorties audio (lus, jamais ouverts), ce que consomme la suite (mémoire et processeur), le compte de
# l'utilisateur (SID) et la valeur « Mindset » de la clé Run. La même version que la suite.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

# Pas `workspace = true` : le module Windows (src\windows) autorise lui-même le code « unsafe » (#![allow(unsafe_code)]) ;
# ailleurs il est refusé (deny).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
