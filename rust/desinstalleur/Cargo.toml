[package]
name = "desinstalleur"
version = "0.1.0"
description = "« Desinstaller Mindset.exe » : retire Mindset et ses applis du PC (remplace outils/desinstalleur.cs)"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "desinstaller-mindset"
path = "src/main.rs"

[features]
# Seulement pour outils\tester-desinstallation.ps1 : les options -Test (faux environnement) et -EssaiFenetre (fenêtre
# hors de l'écran qui se clique seule). L'exe livré est construit SANS cette option : il ne les connaît pas.
essai = []

[dependencies]
# Versions figées (« = ») : une nouvelle version n'entre que par un changement relu (les mêmes que l'Aide de Nevermind).
serde_json = "=1.0.154"
windows-registry = "=0.6.1"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints.rust]
# Le code « unsafe » n'est permis que dans le module Windows (src/os), qui l'autorise lui-même ; ailleurs, interdit.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
