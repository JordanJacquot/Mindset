[package]
name = "mindset-console"
version = "0.1.0"
description = "Mindset en Rust, bloc « console 3D » : l'hôte de la scène (console.ps1, console/scene.html)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# La construction d'essai seulement (activée par mindset-appli/essai), jamais dans le Mindset livré
[features]
essai = []

[dependencies]
mindset-noyau = { path = "../mindset-noyau" }
# La bibliothèque commune de la suite : le thème (couleurs, packs), les versions, les types d'images, la lecture « à
# la PowerShell » des valeurs
suite-commun = { path = "../suite-commun" }
# Versions figées (« = ») : les mêmes que Nevermind (D:\Projets\Nevermind\rust\Cargo.lock).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

# Le seul module qui parle à Windows (src\windows) : trouver la fenêtre d'une appli qui démarre (lecture seule). La
# même version que la suite.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

# Pas `workspace = true` : le module Windows (src\windows) autorise lui-même le code « unsafe » ; ailleurs il est
# refusé (deny).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
