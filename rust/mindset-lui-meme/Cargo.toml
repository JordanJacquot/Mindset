[package]
name = "mindset-lui-meme"
version = "0.1.0"
description = "Mindset en Rust, bloc « Mindset lui-même » : son installation, sa mise à jour, les mises à jour automatiques, sa bienvenue, sa désinstallation (mindset.ps1, début de Mindset.ps1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mindset-noyau = { path = "../mindset-noyau" }
# La bibliothèque commune de la suite : versions, chemins comme .NET, signature, lecture « à la PowerShell »
suite-commun = { path = "../suite-commun" }
# Versions figées (« = ») : les mêmes que Nevermind (D:\Projets\Nevermind\rust\Cargo.lock).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# Les règles écrites en expressions de .NET (-match, -replace) : Get-RaisonEchecMaj, ConvertTo-EntreeMaj
regex = "=1.13.1"

# Le module Windows (src\windows) : raccourcis (IShellLinkW, identité de la barre des tâches), registre (Run en
# écriture, « Applications installées » en lecture), disques, compte (SID), activité (plein écran, manette,
# clavier et souris), nom lisible d'un programme, marque « téléchargé depuis Internet ».
[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Pas `workspace = true` : le module Windows (src\windows) autorise lui-même le code « unsafe » (#![allow(unsafe_code)]) ;
# ailleurs il est refusé (deny).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
