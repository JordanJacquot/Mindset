[package]
name = "mindset-horloge"
version = "0.1.0"
description = "Mindset en Rust, bloc « près de l'horloge » : l'icône près de l'horloge, son menu, ses bulles, la croix rouge (zone.ps1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# La construction d'essai seulement (activée par mindset-appli/essai), jamais dans le Mindset livré
[features]
essai = []

[dependencies]
mindset-noyau = { path = "../mindset-noyau" }
# La lecture des fichiers comme .NET (marque d'encodage), le vrai et le texte « à la PowerShell »
suite-commun = { path = "../suite-commun" }
# Versions figées (« = ») : les mêmes que Nevermind (D:\Projets\Nevermind\rust\Cargo.lock).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

# Le seul module qui parle à Windows (src\windows) : l'icône près de l'horloge (Shell_NotifyIconW), sa fenêtre de
# messages jamais montrée, son menu, ses bulles. La même version que la suite.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Pas `workspace = true` : le module Windows (src\windows) autorise lui-même le code « unsafe »
# (#![allow(unsafe_code)]) ; ailleurs il est refusé (deny).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
