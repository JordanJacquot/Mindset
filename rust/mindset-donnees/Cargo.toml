[package]
name = "mindset-donnees"
version = "0.1.0"
description = "Mindset en Rust, bloc « données » : les dossiers de la suite, le journal, les réglages, les fichiers JSON sûrs, suite.json (donnees.ps1, suite.ps1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mindset-noyau = { path = "../mindset-noyau" }
# La bibliothèque commune de la suite (ce dépôt) : json_sur (Read-JsonSur, Save-JsonSur), chemins (Split-Path, -ieq),
# les valeurs « à la PowerShell » (protocole_installateur::vrai_ps, texte_ps)
suite-commun = { path = "../suite-commun" }
# Versions figées (« = ») : les mêmes que Nevermind (D:\Projets\Nevermind\rust\Cargo.lock).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

# Le seul module qui parle à Windows (src\windows) : la LECTURE de InstallLocation sous HKLM. La même version que la
# suite.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_System_Registry"]

# Pas `workspace = true` : le module Windows (src\windows) autorise lui-même le code « unsafe » (#![allow(unsafe_code)]) ;
# ailleurs il est refusé (deny).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
