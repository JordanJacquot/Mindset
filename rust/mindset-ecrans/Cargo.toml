[package]
name = "mindset-ecrans"
version = "0.1.0"
description = "Mindset en Rust, bloc « écrans » : les écrans WPF refaits en HTML à l'identique, l'accueil classique, la page d'une appli, les bandeaux, les questions (interface.xaml, interface.ps1, accueil.ps1, chargement.ps1, logo.ps1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mindset-noyau = { path = "../mindset-noyau" }
# La bibliothèque commune de la suite (ce dépôt) : les thèmes et leurs couleurs, les packs, la lecture « à la
# PowerShell » des valeurs (etat.json des applis), les versions, version.json
suite-commun = { path = "../suite-commun" }
# Versions figées (« = ») : les mêmes que Nevermind (D:\Projets\Nevermind\rust\Cargo.lock).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

# Le seul module qui parle à Windows (src\windows) : la boîte « choisir un dossier ». La même version que la suite.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"]

# Pas `workspace = true` : le module Windows (src\windows) autorise lui-même le code « unsafe » ; ailleurs il est
# refusé (deny).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
