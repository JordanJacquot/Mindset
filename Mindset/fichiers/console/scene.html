<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindset, la console</title>
<style>
/* L'accueil de Mindset : une pièce japonaise ouverte sur un jardin (décor dessiné), la console posée sur le meuble
   (dessinée aussi, son écran affiche le menu), les cartouches des applis devant. Affichée par Mindset (WebView2,
   console.ps1), hors connexion : tout vient du dossier « console ». Elle ne fait rien d'elle-même : elle envoie les
   demandes à Mindset. */
html, body { height: 100%; margin: 0; overflow: hidden; background: #07060D; color: #ECEAF7; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; user-select: none; }
#flou { position: fixed; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(0.55); }
#zone { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#scene { position: relative; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); overflow: hidden; }
#plan { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform, filter; }
#fond { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#effets, #trois { position: absolute; inset: 0; width: 100%; height: 100%; }
/* L'écran de la console, en grand (après le zoom) : installer, mettre à jour, le téléchargement, le chargement */
#voile { position: absolute; inset: 0; opacity: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 24px; }
#voile img { width: 120px; height: 120px; }
#voile b { font-size: 34px; }
#voile span { font-size: 16px; color: rgba(255,255,255,0.8); max-width: 44ch; }
#voile .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 10px; }
#voile button { height: 46px; padding: 0 24px; border-radius: 23px; border: 0; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
#voile .principal { background: #FFFFFF; color: #0A0812; }
#voile .second { background: rgba(255,255,255,0.16); color: #FFFFFF; }
#voile .maj { background: #FFB020; color: #1A1206; }
#voile button:focus-visible, #ronds button:focus-visible { outline: 3px solid #00E5FF; outline-offset: 3px; }
#voile .barre { width: min(420px, 70%); }
#voile .barre i { display: block; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.18); overflow: hidden; }
#voile .barre i b { display: block; height: 100%; width: 0; background: #FFB020; border-radius: 5px; transition: width 300ms ease; }
#voile .barre em { display: block; margin-top: 8px; font-style: normal; font-size: 15px; color: rgba(255,255,255,0.85); }
#voile .roue { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.18); border-top-color: #FFFFFF; animation: tourne 0.9s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
/* Les boutons ronds, comme sur une console */
#ronds { position: absolute; right: 2.5%; bottom: 4%; display: flex; gap: 14px; }
#ronds button { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 28%, #3a355a, #14102a 75%); box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 10px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18); transition: transform 120ms ease; }
#ronds button:hover { transform: translateY(-3px); }
#ronds svg { width: 24px; height: 24px; }
#ronds span { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 10px; background: rgba(14,12,28,0.9); color: #ECEAF7; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms ease; }
#ronds button:hover span, #ronds button:focus-visible span { opacity: 1; }
#bulle { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 9px 16px; border-radius: 18px; background: rgba(14,13,22,0.92); border: 1px solid #3A3466; font-size: 14px; opacity: 0; transition: opacity 200ms ease; pointer-events: none; white-space: nowrap; }
#bulle.vu { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #voile .roue { animation-duration: 3s; } }
</style>
</head>
<body>
<div id="flou" aria-hidden="true"></div>
<div id="zone"><div id="scene">
  <div id="plan"><img id="fond" alt=""><canvas id="effets" aria-hidden="true"></canvas><canvas id="trois" aria-label="La console et les cartouches : clique sur une cartouche pour l'insérer"></canvas>
    <nav id="ronds" aria-label="Mindset">
      <button type="button" data-r="parametres" aria-label="Paramètres"><svg viewBox="0 0 24 24" fill="none" stroke="#C9C4DD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Paramètres</span></button>
      <button type="button" data-r="actualiser" aria-label="Chercher les nouvelles versions"><svg viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Chercher les nouvelles versions</span></button>
      <button type="button" data-r="veille" aria-label="Mettre Mindset en veille"><svg viewBox="0 0 24 24" fill="none" stroke="#FF5C7A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0"/></svg><span>Veille (près de l'horloge)</span></button>
    </nav></div>
  <div id="voile" role="dialog" aria-label="L'écran de la console"><img id="voileLogo" alt=""><b id="voileNom"></b><span id="voileTexte"></span>
    <div class="roue" id="voileRoue" hidden></div>
    <div class="barre" id="voileBarre" hidden><i><b></b></i><em></em></div>
    <div class="actions" id="voileActions"></div></div>
</div></div>
<div id="bulle" role="status" aria-live="polite"></div>
<script type="importmap">
{ "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const POLICE = '"Segoe UI Variable Display", "Segoe UI", sans-serif';
const params = new URLSearchParams(location.search);
const vitesse = params.get('animations') === 'express' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.4 : 1;
// Messages vers Mindset : seulement des actions connues, avec l'identifiant d'une appli (Mindset vérifie tout)
const hote = (type, donnees = {}) => { try { window.chrome?.webview?.postMessage({ type, ...donnees }); } catch (e) {} };

// ---------------------------------------------------------------- le décor : il suit l'heure (jour, coucher de soleil, nuit)
// x, y : où le socle de la console se pose (part de la largeur, de la hauteur de l'image) ; l : largeur de la console
const DECORS = {
  jour: { x: 0.4997, y: 0.718, l: 0.17, lumiere: 0xfff2e0, ciel: 0xbfd8ff, effet: 'petales' },
  soir: { x: 0.502, y: 0.72, l: 0.16, lumiere: 0xffc488, ciel: 0xff9a6a, effet: 'petales' },
  nuit: { x: 0.499, y: 0.708, l: 0.17, lumiere: 0x9fb4ff, ciel: 0x5a6ad0, effet: 'lucioles' },
};
const momentDuJour = () => { const h = new Date().getHours(); return h >= 20 || h < 7 ? 'nuit' : h >= 18 ? 'soir' : 'jour'; };
let nomDecor = momentDuJour(), decor = DECORS[nomDecor];
const fond = document.getElementById('fond'), plan = document.getElementById('plan'), voile = document.getElementById('voile');
function montrerDecor() { fond.src = `decor/${nomDecor}.jpg`; document.getElementById('flou').style.backgroundImage = `url("decor/${nomDecor}.jpg")`; }

// ---------------------------------------------------------------- l'état des applis, donné par Mindset (window.mindset.etat)
let APPLIS = {};          // id -> { nom, c, installee, etat: ferme | ouvert | fond, maj: null | { etat, progres } }
let TUILES = [];          // l'ordre des applis
const logos = {}, logosDemandes = {};
function chargerLogo(id, url) {
  if (!url || logosDemandes[id] === url) return;
  logosDemandes[id] = url;
  const im = new Image();
  if (url.startsWith('https://')) im.crossOrigin = 'anonymous';   // (logo servi par Mindset hors du dossier de la console)
  im.onload = () => { logos[id] = im; carts[id]?.redessiner(); };
  im.src = url;
}
chargerLogo('mindset', 'logos/mindset.png');

// ---------------------------------------------------------------- petits sons de console (après le premier clic)
const son = { ctx: null, bip(f, d, v, type = 'triangle', f2) { if (!this.ctx) return; try { const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} } };
addEventListener('pointerdown', () => { try { son.ctx ??= new AudioContext(); son.ctx.resume?.(); } catch (e) {} }, true);
const sons = { survol: () => son.bip(2000, 0.03, 0.02, 'square'), envol: () => son.bip(400, 0.35, 0.03, 'sine', 1400), clac: () => { son.bip(180, 0.06, 0.08, 'square'); setTimeout(() => son.bip(1200, 0.05, 0.03, 'square'), 60); }, allume: () => [523, 784, 1047].forEach((f, i) => setTimeout(() => son.bip(f, 0.14, 0.04), i * 90)), ejecte: () => son.bip(900, 0.12, 0.04, 'sine', 300), ok: () => son.bip(880, 0.05, 0.04) };

// ---------------------------------------------------------------- moteur (les cartouches en relief, ombrées en 3 tons comme un dessin animé)
const cv = document.getElementById('trois');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0, 0); renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(24, 16 / 9, 0.05, 100);
const ciel = new THREE.HemisphereLight(0xffffff, 0x2a2238, 1.3); scene.add(ciel);
const cle = new THREE.DirectionalLight(0xffffff, 2.4); cle.position.set(-2, 4, 7); scene.add(cle);
const tons = (() => { const t = new THREE.DataTexture(new Uint8Array([95, 175, 255]), 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const contour = new THREE.MeshBasicMaterial({ color: 0x120e18, side: THREE.BackSide });
function piece(geo, mat, parent, pos = [0, 0, 0], e = 0.04) {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); parent.add(m);
  if (e) { geo.computeBoundingBox(); const s = geo.boundingBox.getSize(new THREE.Vector3()); const o = new THREE.Mesh(geo, contour); o.scale.set((s.x + 2 * e) / s.x, (s.y + 2 * e) / s.y, (s.z + 2 * e) / Math.max(s.z, 0.01)); m.add(o); }
  return m;
}

// ---------------------------------------------------------------- la console, dessinée dans le style du décor (une image découpée, de face)
// Son écran dessiné reçoit le menu ; la fente est au milieu du bord du haut ; le bas de l'image est posé sur le meuble.
const CONSOLE = { w: 854, h: 631, ecran: [45, 35, 785, 540] }, LARGEUR = 4.1;
const cons = new THREE.Group(); scene.add(cons);
const k0 = LARGEUR / CONSOLE.w, HAUT = CONSOLE.h * k0;
const texConsole = new THREE.TextureLoader().load('decor/console.png'); texConsole.colorSpace = THREE.SRGBColorSpace; texConsole.anisotropy = 8;
const corps = new THREE.Mesh(new THREE.PlaneGeometry(LARGEUR, HAUT), new THREE.MeshBasicMaterial({ map: texConsole, transparent: true, alphaTest: 0.5, toneMapped: false }));
corps.position.set(0, HAUT / 2, 0); cons.add(corps);
const ecv = document.createElement('canvas'); ecv.width = 1024; ecv.height = 576; const ex = ecv.getContext('2d');
const ecranTex = new THREE.CanvasTexture(ecv); ecranTex.colorSpace = THREE.SRGBColorSpace; ecranTex.anisotropy = 8;
const [ex0, ey0, ex1, ey1] = CONSOLE.ecran;
const ecran = new THREE.Mesh(new THREE.PlaneGeometry((ex1 - ex0) * k0, (ey1 - ey0) * k0), new THREE.MeshBasicMaterial({ map: ecranTex, toneMapped: false }));
ecran.position.set(((ex0 + ex1) / 2 - CONSOLE.w / 2) * k0, HAUT - (ey0 + ey1) / 2 * k0, 0.01); cons.add(ecran);
const fente = new THREE.Object3D(); fente.position.set(0, HAUT - 0.02, -0.03); cons.add(fente);
const ombre = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.2), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 128; const k = c.getContext('2d'); const g = k.createRadialGradient(128, 64, 4, 128, 64, 124); g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); k.fillStyle = g; k.fillRect(0, 0, 256, 128); return new THREE.CanvasTexture(c); })() }));
ombre.rotation.x = -Math.PI / 2; ombre.position.set(0, 0.01, 0.3); cons.add(ombre);

// Le menu sur l'écran de la console : Mindset et l'heure en haut, une tuile par appli avec son état, la consigne en bas
let enFente = null, demarrage = 0;
function dessinerEcran(t) {
  const g = ex.createLinearGradient(0, 0, 1024, 576); g.addColorStop(0, '#120E28'); g.addColorStop(1, '#05040C'); ex.fillStyle = g; ex.fillRect(0, 0, 1024, 576);
  const a = enFente && APPLIS[enFente];
  if (a && demarrage > 0) {
    const r = ex.createRadialGradient(512, 288, 10, 512, 288, 600); r.addColorStop(0, a.c + 'AA'); r.addColorStop(1, 'rgba(0,0,0,0)'); ex.globalAlpha = Math.min(1, demarrage); ex.fillStyle = r; ex.fillRect(0, 0, 1024, 576);
    if (logos[enFente]) ex.drawImage(logos[enFente], 402, 130, 220, 220);
    ex.fillStyle = '#FFFFFF'; ex.font = `800 60px ${POLICE}`; ex.textAlign = 'center'; ex.textBaseline = 'alphabetic'; ex.fillText(a.nom, 512, 440); ex.globalAlpha = 1; return;
  }
  if (logos.mindset) ex.drawImage(logos.mindset, 52, 34, 64, 64);
  ex.textBaseline = 'middle'; ex.textAlign = 'left'; ex.fillStyle = '#FFFFFF'; ex.font = `700 40px ${POLICE}`; ex.fillText('Mindset', 130, 67);
  ex.textAlign = 'right'; ex.fillStyle = '#C9C4DD'; ex.font = `600 40px ${POLICE}`; ex.fillText(new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }), 972, 67);
  const n = Math.max(1, TUILES.length), s = Math.min(220, Math.floor((900 - (n - 1) * 36) / n)), ecart = n > 1 ? Math.min(50, (900 - n * s) / (n - 1)) : 0, x0 = 512 - (n * s + (n - 1) * ecart) / 2;
  TUILES.forEach((id, i) => {
    const app = APPLIS[id], X = x0 + i * (s + ecart), Y = 140, choisi = a ? id === enFente : i === Math.floor(t / 2.5) % n;
    ex.fillStyle = choisi ? '#1E1A3E' : '#141126'; ex.beginPath(); ex.roundRect(X, Y, s, s, 30); ex.fill();
    if (choisi) { ex.lineWidth = 7; ex.strokeStyle = app.c; ex.stroke(); }
    if (logos[id]) { ex.globalAlpha = app.installee ? 1 : 0.5; ex.drawImage(logos[id], X + s * 0.18, Y + s * 0.12, s * 0.64, s * 0.64); ex.globalAlpha = 1; }
    else { ex.fillStyle = app.c; ex.font = `900 ${Math.round(s * 0.45)}px ${POLICE}`; ex.textAlign = 'center'; ex.fillText(app.nom.charAt(0).toUpperCase(), X + s / 2, Y + s * 0.45); }
    ex.textAlign = 'center'; ex.fillStyle = choisi ? '#FFFFFF' : '#C9C4DD'; ex.font = `700 ${Math.round(s * 0.135)}px ${POLICE}`; ex.fillText(app.nom, X + s / 2, Y + s - s * 0.11);
    const m = app.maj;
    if (m && m.etat !== 'dispo') { ex.fillStyle = 'rgba(255,255,255,0.18)'; ex.beginPath(); ex.roundRect(X + 20, Y + s + 16, s - 40, 10, 5); ex.fill(); ex.fillStyle = '#FFB020'; ex.beginPath(); ex.roundRect(X + 20, Y + s + 16, Math.max(10, (s - 40) * (m.etat === 'installation' ? 1 : m.progres)), 10, 5); ex.fill(); }
    else if (!app.installee) { ex.fillStyle = '#A9A3C9'; ex.font = `600 24px ${POLICE}`; ex.fillText('À installer', X + s / 2, Y + s + 34); }
    else if (m) { ex.fillStyle = '#FFB020'; ex.beginPath(); ex.roundRect(X + s / 2 - 80, Y + s + 12, 160, 36, 18); ex.fill(); ex.fillStyle = '#1A1206'; ex.font = `800 22px ${POLICE}`; ex.fillText('Mise à jour', X + s / 2, Y + s + 31); }
  });
  ex.textAlign = 'center'; ex.fillStyle = '#ECEAF7'; ex.font = `600 34px ${POLICE}`;
  ex.fillText(!TUILES.length ? 'Chargement des applis...' : a ? `${a.nom} est en pause : clique sur sa cartouche` : 'Clique sur une cartouche pour l\'ouvrir', 512, 470);
  ex.textBaseline = 'alphabetic';
}

// ---------------------------------------------------------------- les cartouches (une par appli) : en relief, une étiquette avec le logo et le nom
function etiquette(id) {
  const a = APPLIS[id], c = document.createElement('canvas'); c.width = 256; c.height = 300; const k = c.getContext('2d');
  k.fillStyle = '#1b1830'; k.fillRect(0, 0, 256, 300); k.fillStyle = a.c; k.fillRect(0, 0, 256, 34); k.strokeStyle = a.c; k.lineWidth = 8; k.strokeRect(4, 4, 248, 292);
  if (logos[id]) k.drawImage(logos[id], 48, 56, 160, 160); else { k.fillStyle = a.c; k.font = `900 120px ${POLICE}`; k.textAlign = 'center'; k.fillText(a.nom.charAt(0).toUpperCase(), 128, 180); }
  k.fillStyle = '#FFFFFF'; k.textAlign = 'center'; let taille = 34; k.font = `800 ${taille}px ${POLICE}`; while (k.measureText(a.nom).width > 230 && taille > 16) { taille -= 2; k.font = `800 ${taille}px ${POLICE}`; }
  k.fillText(a.nom, 128, 266);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const carts = {};
function creerCartouche(id) {
  const g = new THREE.Group(); scene.add(g);
  piece(new RoundedBoxGeometry(0.9, 1.05, 0.14, 3, 0.06), new THREE.MeshToonMaterial({ color: 0x2c2838, gradientMap: tons }), g, [0, 0, 0], 0.035);
  const lab = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.92), new THREE.MeshBasicMaterial({ toneMapped: false })); lab.position.z = 0.072; g.add(lab);
  piece(new THREE.BoxGeometry(0.6, 0.06, 0.1), new THREE.MeshToonMaterial({ color: 0xc9a24a, gradientMap: tons }), g, [0, -0.55, 0], 0);
  const c = { id, g, lab, k: 0, etat: 'repos', phase: Object.keys(carts).length * 1.7, repos: new THREE.Vector3(), echelleRepos: 1,
    redessiner() { lab.material.map?.dispose(); lab.material.map = etiquette(id); lab.material.needsUpdate = true; } };
  c.redessiner(); carts[id] = c; return c;
}
function retirerCartouche(id) { const c = carts[id]; if (!c) return; scene.remove(c.g); c.g.traverse((o) => { o.geometry?.dispose(); if (o.material && o.material !== contour) { o.material.map?.dispose(); o.material.dispose(); } }); delete carts[id]; }

// ---------------------------------------------------------------- placer la console et les cartouches sur l'image
const camBase = new THREE.Vector3(0, 1.4, 30);
const surImage = (fx, fy, z = 0) => { const p = new THREE.Vector3(fx * 2 - 1, 1 - 2 * fy, 0.5).unproject(camera), d = p.sub(camera.position).normalize(), k = (z - camera.position.z) / d.z; return camera.position.clone().addScaledVector(d, k); };
let largeurVue = 1, echelleCons = 1, pointFente = new THREE.Vector3();
function poser() {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.position.copy(camBase); camera.lookAt(0, 1.4, 0); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  largeurVue = 2 * camBase.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  echelleCons = (decor.l * largeurVue) / LARGEUR; cons.scale.setScalar(echelleCons); cons.position.copy(surImage(decor.x, decor.y));
  cons.updateMatrixWorld(); pointFente = fente.getWorldPosition(new THREE.Vector3());
  // les cartouches : plus près de toi, en bas de l'image, bien cliquables
  const n = Math.max(1, TUILES.length), esp = Math.min(0.15, 0.62 / n), zc = 9, ech = (0.062 * largeurVue * (camBase.z - zc) / camBase.z) / 0.9 * Math.min(1, 4 / Math.max(4, n));
  TUILES.forEach((id, i) => { const c = carts[id]; if (!c) return; c.repos.copy(surImage(0.5 + (i - (n - 1) / 2) * esp, 0.835, zc)); c.echelleRepos = ech; if (c.etat === 'repos') { c.g.position.copy(c.repos); c.g.scale.setScalar(ech); } });
  ciel.color.set(decor.ciel); cle.color.set(decor.lumiere);
}

// ---------------------------------------------------------------- animations : une petite file de mouvements
let anims = [];
const anim = (d, maj, fin) => anims.push({ t0: performance.now() / 1000, d: d * vitesse, maj, fin });
const doux = (p) => p * p * (3 - 2 * p), sortie = (p) => 1 - (1 - p) ** 3;
let occupe = false, zoome = false, ouverte = null;   // ouverte : l'appli dont l'écran est affiché en grand
const pretes = {}, demandeOuverture = {};

// Cliquer une cartouche : elle s'insère (celle qui était dans la fente ressort d'abord), puis on zoome dans l'écran
function choisirCartouche(id) {
  const a = APPLIS[id], c = carts[id]; if (!a || !c || occupe || zoome) return;
  // une appli installée et à jour : Mindset la lance tout de suite, pendant l'animation (elle s'affichera à la fin)
  if (a.installee && !a.maj) { pretes[id] = false; demandeOuverture[id] = true; hote('action', { action: 'ouvrir', id }); }
  inserer(c);
}
function inserer(c) {
  occupe = true;
  if (enFente === c.id) { zoomer(c.id); return; }
  const autre = enFente && carts[enFente];
  const voler = () => {
    c.etat = 'vol'; sons.envol();
    const de = c.g.position.clone(), s0 = c.g.scale.x, dessus = pointFente.clone().add(new THREE.Vector3(0, 1.1 * echelleCons, 0));
    const ctrl = de.clone().lerp(dessus, 0.5).add(new THREE.Vector3(0, 2.5, 0));
    anim(0.9, (p) => { const k = doux(p); const a = de.clone().lerp(ctrl, k), b = ctrl.clone().lerp(dessus, k); c.g.position.copy(a.lerp(b, k)); c.g.scale.setScalar(THREE.MathUtils.lerp(s0, echelleCons, k)); c.g.rotation.set(0, k * Math.PI * 2, Math.sin(k * Math.PI) * 0.3); }, () => {
      // (elle descend derrière le bord de la console : le dessin la cache, comme si elle entrait dans la fente)
      anim(0.32, (p) => { c.g.position.copy(dessus.clone().lerp(pointFente.clone().add(new THREE.Vector3(0, -0.3 * echelleCons, 0)), p * p)); c.g.position.z = pointFente.z - 0.05; c.g.rotation.set(0, 0, 0); }, () => {
        sons.clac(); c.etat = 'fente'; enFente = c.id;
        const y0 = cons.position.y; anim(0.18, (p) => { cons.position.y = y0 - Math.sin(p * Math.PI) * 0.04 * echelleCons; }, () => { cons.position.y = y0; });
        setTimeout(() => { sons.allume(); demarrage = 0.001; anim(0.6, (p) => { demarrage = p; }, () => zoomer(c.id)); }, 250 * vitesse);
      });
    });
  };
  if (autre) ejecter(autre, voler); else voler();
}
function ejecter(c, ensuite) {
  sons.ejecte(); const de = pointFente.clone().add(new THREE.Vector3(0, -0.3 * echelleCons, -0.05)), haut = pointFente.clone().add(new THREE.Vector3(0, 1.2 * echelleCons, 0));
  c.etat = 'vol'; if (enFente === c.id) enFente = null; demarrage = 0;
  anim(0.3, (p) => c.g.position.copy(de.clone().lerp(haut, sortie(p))), () => {
    const s0 = c.g.scale.x, ctrl = haut.clone().lerp(c.repos, 0.5).add(new THREE.Vector3(0, 2, 0));
    anim(0.8, (p) => { const k = doux(p); const a = haut.clone().lerp(ctrl, k), b = ctrl.clone().lerp(c.repos, k); c.g.position.copy(a.lerp(b, k)); c.g.scale.setScalar(THREE.MathUtils.lerp(s0, c.echelleRepos, k)); c.g.rotation.y = -k * Math.PI * 2; }, () => { c.etat = 'repos'; c.g.rotation.set(0, 0, 0); ensuite?.(); });
  });
}
function placerEnFente(id) {   // (sans animation : une vue rouverte alors qu'une appli était affichée)
  const c = carts[id]; if (!c) return;
  c.etat = 'fente'; enFente = id; c.g.scale.setScalar(echelleCons); c.g.rotation.set(0, 0, 0);
  c.g.position.copy(pointFente.clone().add(new THREE.Vector3(0, -0.3 * echelleCons, -0.05)));
}
// Le zoom dans l'écran : tout le plan (décor, console, cartouches) grossit autour de l'écran, puis l'écran s'affiche en grand
const ZOOM = 8;
function origineZoom() { const p = ecran.getWorldPosition(new THREE.Vector3()).project(camera); plan.style.transformOrigin = `${(p.x + 1) / 2 * 100}% ${(1 - p.y) / 2 * 100}%`; }
function zoomer(id) {
  const a = APPLIS[id]; origineZoom(); ouverte = id;
  document.getElementById('voileLogo').src = logosDemandes[id] || ''; document.getElementById('voileNom').textContent = a.nom;
  voile.style.background = `radial-gradient(circle at 50% 45%, ${a.c}55, #07060D 70%)`;
  remplirEcran();
  anim(1.0, (q) => { const k = q * q * q; plan.style.transform = `scale(${1 + k * ZOOM})`; plan.style.filter = `blur(${Math.max(0, q - 0.6) * 10}px)`; voile.style.opacity = Math.max(0, (q - 0.55) / 0.45); }, () => {
    zoome = true; occupe = false; voile.style.pointerEvents = 'auto'; remplirEcran(); voile.querySelector('#voileActions button')?.focus();
  });
}
function dezoomer(ensuite) {
  occupe = true; voile.style.pointerEvents = 'none'; ouverte = null;
  anim(0.8, (q) => { const k = 1 - doux(q); plan.style.transform = `scale(${1 + k * ZOOM})`; plan.style.filter = `blur(${Math.max(0, k - 0.6) * 10}px)`; voile.style.opacity = Math.max(0, 1 - q * 2.2); }, () => {
    plan.style.transform = ''; plan.style.filter = ''; zoome = false; demarrage = 0; occupe = false; ensuite?.();
  });
}
// Revenir au menu depuis l'écran : la cartouche ne reste dans la console que si l'appli tourne
function revenirAuMenu() {
  const id = enFente;
  dezoomer(() => { const a = id && APPLIS[id]; if (id && (!a || a.etat === 'ferme')) { occupe = true; ejecter(carts[id], () => { occupe = false; }); } });
}

// Ce que montre l'écran en grand : le chargement de l'appli, l'installation, la mise à jour, ou leur avancée
function remplirEcran() {
  const id = ouverte, a = id && APPLIS[id]; if (!a) return;
  const texte = document.getElementById('voileTexte'), actions = document.getElementById('voileActions'), barre = document.getElementById('voileBarre'), roue = document.getElementById('voileRoue');
  const m = a.maj, charge = m && m.etat !== 'dispo';
  let t, boutons = [], attente = false;
  if (charge) { t = a.installee ? `Mise à jour de ${a.nom}...` : `Installation de ${a.nom}...`; boutons = [['menu', 'Menu', 'second']]; }
  else if (!a.installee) { t = `${a.nom} n'est pas encore installée.`; boutons = [['installer', `Installer ${a.nom}`, 'principal'], ['menu', 'Retirer la cartouche', 'second']]; }
  else if (demandeOuverture[id]) { t = `Ouverture de ${a.nom}...`; attente = true; }
  else if (m) { t = `Une nouvelle version de ${a.nom} est prête.`; boutons = [['maj', 'Mettre à jour', 'maj'], ['ouvrir', 'Ouvrir sans mettre à jour', 'second'], ['menu', 'Menu', 'second']]; }
  else { t = `${a.nom} est prête.`; boutons = [['ouvrir', `Ouvrir ${a.nom}`, 'principal'], ['menu', 'Menu', 'second']]; }
  const cleEcran = t + boutons.map((x) => x[0]).join();
  if (actions.dataset.cle !== cleEcran) {
    texte.textContent = t; actions.dataset.cle = cleEcran;
    actions.innerHTML = boutons.map(([f, txt, cls]) => `<button type="button" class="${cls}" data-f="${f}">${txt}</button>`).join('');
    if (zoome) actions.querySelector('button')?.focus();
  }
  roue.hidden = !attente; barre.hidden = !charge;
  if (charge) { barre.querySelector('b').style.width = `${Math.round((m.etat === 'installation' ? 1 : m.progres) * 100)}%`; barre.querySelector('em').textContent = m.etat === 'installation' ? 'Installation...' : `Téléchargement ${Math.round(m.progres * 100)} %`; }
  // l'appli ouverte est prête : elle prend la place de la console
  if (attente && zoome && pretes[id]) { demandeOuverture[id] = false; hote('afficher', { id }); }
}
document.getElementById('voileActions').addEventListener('click', (e) => {
  const b = e.target.closest('button'), id = ouverte; if (!b || !id || occupe) return; sons.ok();
  if (b.dataset.f === 'menu') revenirAuMenu();
  if (b.dataset.f === 'installer') hote('action', { action: 'installer', id });
  if (b.dataset.f === 'maj') hote('action', { action: 'maj', id });
  if (b.dataset.f === 'ouvrir') { pretes[id] = false; demandeOuverture[id] = true; hote('action', { action: 'ouvrir', id }); remplirEcran(); }
});
document.querySelectorAll('#ronds button').forEach((b) => b.addEventListener('click', () => { if (occupe || zoome) return; sons.ok(); hote('action', { action: b.dataset.r }); }));

// ---------------------------------------------------------------- souris et clavier
const souris = new THREE.Vector2(9, 9), rayon = new THREE.Raycaster(); let vise = null;
cv.addEventListener('pointermove', (e) => { const r = cv.getBoundingClientRect(); souris.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); });
cv.addEventListener('pointerleave', () => souris.set(9, 9));
cv.addEventListener('click', () => { if (vise) choisirCartouche(vise.id); });
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && zoome && !occupe && !demandeOuverture[ouverte]) { e.preventDefault(); revenirAuMenu(); return; }
  const n = parseInt(e.key, 10); if (n >= 1 && n <= TUILES.length && !zoome) choisirCartouche(TUILES[n - 1]);
});

// ---------------------------------------------------------------- les effets dessinés par-dessus le décor : pétales, ou lucioles la nuit
const ef = document.getElementById('effets'), fx = ef.getContext('2d');
const parts = Array.from({ length: 46 }, () => ({ u: Math.random(), v: Math.random(), s: 0.5 + Math.random(), ph: Math.random() * 6 }));
function effets(t) {
  const W = ef.clientWidth, H = ef.clientHeight, d = Math.min(devicePixelRatio, 2);
  if (ef.width !== Math.round(W * d)) { ef.width = Math.round(W * d); ef.height = Math.round(H * d); }
  fx.setTransform(d, 0, 0, d, 0, 0); fx.clearRect(0, 0, W, H);
  if (decor.effet === 'lucioles') {
    parts.forEach((q) => { const a = (q.u + Math.sin(t * 0.3 + q.ph) * 0.03) * W, b = (0.2 + q.v * 0.55 + Math.cos(t * 0.4 + q.ph) * 0.02) * H, k = 0.5 + Math.sin(t * 2 + q.ph * 3) * 0.5;
      const g = fx.createRadialGradient(a, b, 0, a, b, 7 * q.s); g.addColorStop(0, `rgba(255,240,150,${k})`); g.addColorStop(1, 'rgba(255,240,150,0)'); fx.fillStyle = g; fx.fillRect(a - 8, b - 8, 16, 16); });
    return;
  }
  parts.forEach((q) => { const a = ((q.u + t * 0.016 * q.s) % 1.2 - 0.1) * W + Math.sin(t * 1.5 + q.ph) * 16, b = ((q.v + t * 0.026 * q.s) % 1) * H;
    fx.save(); fx.translate(a, b); fx.rotate(t * 1.4 + q.ph); fx.scale(1, 0.5 + Math.abs(Math.sin(t * 2 + q.ph)) * 0.5); fx.beginPath(); fx.ellipse(0, 0, 5 * q.s, 3.2 * q.s, 0, 0, Math.PI * 2); fx.fillStyle = 'rgba(255,183,207,0.92)'; fx.fill(); fx.restore(); });
}

// ---------------------------------------------------------------- la boucle : 30 images par seconde au repos, 60 pendant une animation ; rien en pause
let dernier = 0, dernierEcran = 0, enPause = false;
function image() {
  const t = performance.now() / 1000;
  if (!anims.length && !occupe && t - dernier < 1 / 30) return;
  dernier = t;
  const liste = anims; anims = [];   // (un mouvement lancé à la fin d'un autre arrive dans la nouvelle liste : rien ne se perd)
  const gardes = liste.filter((a) => { const p = Math.min(1, (t - a.t0) / Math.max(0.01, a.d)); a.maj(p); if (p >= 1) { a.fin?.(); return false; } return true; });
  anims = gardes.concat(anims);
  rayon.setFromCamera(souris, camera);
  const hit = occupe || zoome ? null : rayon.intersectObjects(Object.values(carts).map((c) => c.g), true)[0];
  let nv = null; if (hit) { let o = hit.object; while (o && !nv) { nv = Object.values(carts).find((c) => c.g === o) || null; o = o.parent; } }
  if (nv !== vise) { vise = nv; if (vise) sons.survol(); } cv.style.cursor = vise ? 'pointer' : 'default';
  for (const c of Object.values(carts)) {
    if (c.etat !== 'repos') continue; c.k += ((c === vise ? 1 : 0) - c.k) * 0.15;
    c.g.position.set(c.repos.x, c.repos.y + Math.sin(t * 1.6 + c.phase) * 0.12 * c.echelleRepos + c.k * 0.25 * c.echelleRepos, c.repos.z);
    c.g.rotation.set(-0.15, Math.sin(t * 0.8 + c.phase) * 0.25, 0); c.g.scale.setScalar(c.echelleRepos * (1 + c.k * 0.12));
    c.lab.material.color.setScalar(APPLIS[c.id]?.installee ? 1 : 0.5);   // (pas encore installée : grisée)
  }
  if (t - dernierEcran > 0.08) { dernierEcran = t; dessinerEcran(t); ecranTex.needsUpdate = true; if (zoome) remplirEcran(); }
  effets(t);
  renderer.render(scene, camera);
}
function pause() { if (!enPause) { enPause = true; renderer.setAnimationLoop(null); } }
function reprendre() { if (enPause) { enPause = false; renderer.setAnimationLoop(image); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else reprendre(); });
addEventListener('resize', () => { poser(); if (zoome) origineZoom(); });
// le décor change tout seul quand le moment de la journée change
setInterval(() => { const m = momentDuJour(); if (m !== nomDecor && !zoome && !occupe) { nomDecor = m; decor = DECORS[m]; montrerDecor(); poser(); } }, 60000);

// ---------------------------------------------------------------- ce que Mindset peut demander
function etat(e) {
  if (!e || !Array.isArray(e.applis)) return;
  const nouvelles = {};
  for (const a of e.applis) {
    if (typeof a.id !== 'string' || !/^[a-z0-9-]{1,30}$/.test(a.id)) continue;
    nouvelles[a.id] = { nom: String(a.nom || a.id).slice(0, 30), c: /^#[0-9A-Fa-f]{6}$/.test(a.c1) ? a.c1 : '#00E5FF',
      installee: !!a.installee, etat: ['ferme', 'ouvert', 'fond'].includes(a.etat) ? a.etat : 'ferme',
      maj: a.maj && ['dispo', 'telechargement', 'installation'].includes(a.maj.etat) ? { etat: a.maj.etat, progres: Number(a.maj.progres) || 0 } : null };
  }
  const avant = APPLIS; APPLIS = nouvelles; TUILES = e.applis.map((a) => a.id).filter((id) => APPLIS[id]);
  for (const a of e.applis) if (APPLIS[a.id]) chargerLogo(a.id, typeof a.logo === 'string' && /^(logos\/|https:\/\/applogos\.mindset\.local\/)[a-z0-9-]+\.png$/.test(a.logo) ? a.logo : null);
  for (const id of Object.keys(carts)) if (!APPLIS[id] && enFente !== id) retirerCartouche(id);
  for (const id of TUILES) { if (!carts[id]) creerCartouche(id); else if (!avant[id] || avant[id].nom !== APPLIS[id].nom || avant[id].c !== APPLIS[id].c) carts[id].redessiner(); }
  poser();
  // une appli fermée pendant que sa cartouche était dans la console, au menu : la cartouche ressort
  if (enFente && !occupe && !zoome && (!APPLIS[enFente] || APPLIS[enFente].etat === 'ferme')) { const c = carts[enFente]; occupe = true; ejecter(c, () => { occupe = false; }); }
  if (zoome) remplirEcran();
}
// Mindset a lancé l'appli (après « ouvrir ») : si la cartouche n'est pas déjà en route, on joue l'insertion
function jouerOuverture(id) { if (!carts[id] || occupe || zoome || enFente === id && ouverte === id) return; demandeOuverture[id] = true; inserer(carts[id]); }
function appliPrete(id) { pretes[id] = true; if (zoome) remplirEcran(); }
// Retour d'une appli (bouton Menu de Mindset, ou appli fermée) : la caméra ressort de l'écran ; ejecter : la cartouche ressort
function jouerRetour(id, ejecter) {
  if (!carts[id]) return;
  const fin = () => { if (ejecter || APPLIS[id]?.etat === 'ferme') { occupe = true; window.setTimeout(() => ejecterMaintenant(id), 50); } };
  if (!zoome) {   // (vue rouverte : on repart de l'intérieur de l'écran)
    if (enFente !== id) placerEnFente(id);
    origineZoom(); plan.style.transform = `scale(${1 + ZOOM})`; voile.style.opacity = 0; zoome = true; ouverte = id;
  }
  demandeOuverture[id] = false; dezoomer(fin);
}
function ejecterMaintenant(id) { const c = carts[id]; if (c && enFente === id) ejecter(c, () => { occupe = false; }); else occupe = false; }
function jouerEjection(id) { if (enFente !== id || occupe) return; if (zoome) dezoomer(() => { occupe = true; ejecterMaintenant(id); }); else { occupe = true; ejecterMaintenant(id); } }
let minuteBulle = 0;
function message(texte) { const b = document.getElementById('bulle'); b.textContent = String(texte).slice(0, 80); b.classList.add('vu'); clearTimeout(minuteBulle); minuteBulle = setTimeout(() => b.classList.remove('vu'), 2400); }
window.mindset = { etat, pause, reprendre, message, jouerOuverture, jouerRetour, jouerEjection, appliPrete };
window.mindsetEssai = { choisirCartouche, cliquer: (f) => document.querySelector(`#voileActions button[data-f="${f}"]`)?.click(), etatScene: () => ({ enFente, zoome, occupe, ouverte }) };   // (pour les essais automatiques)

montrerDecor(); poser();
renderer.setAnimationLoop(image);
hote('pret');
</script>
</body>
