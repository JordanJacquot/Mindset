<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindset, la console</title>
<style>
/* L'accueil de Mindset : une pièce japonaise ouverte sur un jardin (décor dessiné), la console posée sur le meuble
   (dessinée aussi, son écran affiche le menu), les cartouches des applis devant. Affichée par Mindset (WebView2,
   console.ps1), hors connexion : tout vient du dossier « console ». Elle ne fait rien d'elle-même : elle envoie les
   demandes à Mindset. */
html, body { height: 100%; margin: 0; overflow: hidden; background: #07060D; color: #ECEAF7; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; user-select: none; }
#flou { position: fixed; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(0.55); }
#zone { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#scene { position: relative; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); overflow: hidden; }
#plan { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform, filter; }
#fond { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#effets, #trois { position: absolute; inset: 0; width: 100%; height: 100%; }
/* L'écran de la console, en grand (après le zoom) : installer, mettre à jour, le téléchargement, le chargement */
#voile { position: absolute; inset: 0; opacity: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 0 24px; }
#voile img { width: 120px; height: 120px; }
#voile b { font-size: 34px; }
#voile span { font-size: 16px; color: rgba(255,255,255,0.8); max-width: 44ch; }
#voileTexte { white-space: pre-line; }
#voile .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 10px; }
#voile button { height: 46px; padding: 0 24px; border-radius: 23px; border: 0; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
#voile .principal { background: #FFFFFF; color: #0A0812; }
#voile .second { background: rgba(255,255,255,0.16); color: #FFFFFF; }
#voile .maj { background: #FFB020; color: #1A1206; }
#voile button:focus-visible, #ronds button:focus-visible { outline: 3px solid #00E5FF; outline-offset: 3px; }
#voile .barre { width: min(420px, 70%); }
#voile .barre i { display: block; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.18); overflow: hidden; }
#voile .barre i b { display: block; height: 100%; width: 0; background: #FFB020; border-radius: 5px; transition: width 300ms ease; }
#voile .barre.ouverture i b { background: linear-gradient(90deg, #00E5FF, #FFFFFF); transition: width 250ms linear; }
#voile .barre em { display: block; margin-top: 8px; font-style: normal; font-size: 15px; color: rgba(255,255,255,0.85); }
/* Les boutons ronds, comme sur une console */
#ronds { position: absolute; right: 2.5%; bottom: 4%; display: flex; gap: 14px; }
#ronds button { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 28%, #3a355a, #14102a 75%); box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 10px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18); transition: transform 120ms ease; }
#ronds button:hover { transform: translateY(-3px); }
#ronds svg { width: 24px; height: 24px; }
#ronds span { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 10px; background: rgba(14,12,28,0.9); color: #ECEAF7; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 120ms ease; }
#ronds button:hover span, #ronds button:focus-visible span { opacity: 1; }
#bulle { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 9px 16px; border-radius: 18px; background: rgba(14,13,22,0.92); border: 1px solid #3A3466; font-size: 14px; opacity: 0; transition: opacity 200ms ease; pointer-events: none; white-space: nowrap; }
#bulle.vu { opacity: 1; }
/* Le menu de la console en grand (clic sur l'écran) : la ligne des applis en carrousel, comme l'écran d'une console */
#menuGrand { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 4% 5% 3%; box-sizing: border-box; text-align: left; }
#menuGrand[hidden] { display: none; }
#menuGrand .tete { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; }
#menuGrand .tete img { width: 48px; height: 48px; } #menuGrand .tete .hh { margin-left: auto; color: #C9C4DD; font-weight: 600; }
#menuGrand .nomSel { margin-top: auto; height: 34px; font-size: 24px; font-weight: 800; color: var(--c, #00E5FF); text-align: center; white-space: nowrap; }
#menuGrand .descSel { min-height: 42px; max-width: 640px; margin: 2px auto 0; padding: 0 16px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.75); text-align: center; }
/* La rangée des applis (comme l'accueil de Nevermind) : l'appli choisie au centre, on fait glisser la rangée à la
   souris (avec élan), à la molette ou aux flèches ; un clic sur une tuile de côté l'amène au centre, sur celle du
   centre (ou Entrée) la choisit. Les tuiles sont placées par le script (transform). */
#carrousel { --t: clamp(150px, 26vh, 240px); position: relative; flex: 0 0 auto; height: calc(var(--t) * 1.42); margin: 0 -5.5%; overflow: hidden; touch-action: none; cursor: grab; outline: none;
  -webkit-mask: linear-gradient(90deg, transparent, #000 13%, #000 87%, transparent); mask: linear-gradient(90deg, transparent, #000 13%, #000 87%, transparent); }
#carrousel.tenu { cursor: grabbing; }
#carrousel button { --c: #00E5FF; position: absolute; left: 50%; top: 50%; width: var(--t); margin: calc(var(--t) / -2) 0 0 calc(var(--t) / -2); aspect-ratio: 1; border-radius: 26px; border: 1px solid color-mix(in srgb, var(--c) 45%, #2A2450); cursor: inherit;
  background: radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--c) 30%, transparent), transparent 60%), linear-gradient(165deg, #1E1A3E, #0C0920 70%); color: #ECEAF7; font: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px;
  box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 30%, #000), 0 5px 0 color-mix(in srgb, var(--c) 20%, #000), 0 8px 0 color-mix(in srgb, var(--c) 12%, #000), 0 22px 30px rgba(0,0,0,0.55);
  will-change: transform, opacity; -webkit-user-drag: none; }
#carrousel button > * { pointer-events: none; }
#carrousel button img { width: 52%; height: auto; } #carrousel button .l { font-size: 64px; font-weight: 900; color: var(--c); line-height: 1; }
#carrousel button svg.roue { width: 46%; height: auto; }
#carrousel button b { font-size: 19px; } #carrousel button em { font-style: normal; font-size: 14px; color: #A9A3C9; }
#carrousel button em.amettre { color: #FFB020; font-weight: 700; } #carrousel button em.pause { color: #3DDC84; font-weight: 700; }
#carrousel button.pasla img, #carrousel button.pasla .l { opacity: 0.45; }
#carrousel button:focus { outline: none; }
#carrousel button.sel::after { content: ""; position: absolute; inset: -9px; border-radius: 34px; padding: 4px; background: conic-gradient(from var(--tour, 0deg), #00E5FF, #B04BFF, #FF2EB5, #00E5FF);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: tourne 2.4s linear infinite; }
@property --tour { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes tourne { to { --tour: 360deg; } }
#menuGrand .bas { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: #A9A3C9; font-size: 16px; }
#menuGrand .aides { display: flex; gap: 22px; color: #ECEAF7; }
#menuGrand .aides button { all: unset; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; }
#menuGrand .aides i { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(180deg, #FFFFFF, #CFCDE0); color: #14102A; font-style: normal; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
#voile.menu > :not(#menuGrand) { display: none; }
/* (les règles de l'écran d'une appli, #voile img, b, span et button, ne s'appliquent pas au menu) */
#voile #menuGrand img { width: auto; height: auto; } #voile #menuGrand .tete img { width: 48px; height: 48px; object-fit: contain; }
#voile #menuGrand b { font-size: 19px; } #voile #menuGrand span { font-size: inherit; color: inherit; max-width: none; }
#voile #carrousel button { height: auto; padding: 14px; border-radius: 26px; font-size: 16px; font-weight: 600; }
#voile #carrousel button img { width: 52%; }
#voile #menuGrand span.l { font-size: 64px; color: var(--c); }
/* Les Paramètres de Mindset, dans l'écran : la DA des pages de Nevermind (« module déplié » : la carte du module à
   gauche, les réglages à droite, les onglets en pastilles, les bords de plasma). Les règles commencent toutes par
   #reglagesGrand : celles de l'écran d'une appli (#voile b, span, img, button) ne s'y appliquent pas. Les bords de
   plasma ne tournent que sur le module et sur ce qui est choisi ou visé (rien de lourd en boucle). */
#voile.enReglages > :not(#reglagesGrand) { display: none; }
@property --a-tour { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes tourneR { to { --a-tour: 360deg; } }
@keyframes coule { to { background-position: 300% 0; } }
@keyframes flotte { 50% { transform: translateY(-8px); } }
@keyframes tourne2 { to { transform: rotate(360deg); } }
#reglagesGrand { --P: #00E5FF; --S: #B04BFF; --T: #FF2EB5; --carte: rgba(16, 13, 38, 0.82); --carte2: rgba(28, 23, 62, 0.9); --ligne: #2A2450; --texte: #ECEAF7; --doux: #A9A3C9; --pale: #6F6894; --vert: #3DDC84; --orange: #FFB020; --rouge: #FF5C7A; --fond: #07060D; --fond2: #0C0920;
  position: absolute; inset: 0; display: flex; flex-direction: column; padding: 3% 5% 2.4%; box-sizing: border-box; text-align: left; color: var(--texte); }
#reglagesGrand[hidden] { display: none; }
#reglagesGrand b, #reglagesGrand span { font-size: inherit; color: inherit; max-width: none; }
#reglagesGrand img { width: auto; height: auto; }
#reglagesGrand button { height: auto; padding: 0; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-align: inherit; }
#reglagesGrand button:focus-visible { outline: none; }
#reglagesGrand .f:focus-visible { box-shadow: 0 0 0 2px var(--fond), 0 0 0 4px var(--S); }
#reglagesGrand .tete { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex: none; }
#reglagesGrand .retour { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 1px solid var(--ligne); background: var(--carte); display: grid; place-items: center; transition: all 180ms ease; }
#reglagesGrand .retour svg { width: 22px; height: 22px; }
#reglagesGrand .retour:hover, #reglagesGrand .retour:focus { border-color: var(--S); background: color-mix(in srgb, var(--S) 16%, var(--carte)); }
#reglagesGrand .ic-page { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; color: var(--P); }
#reglagesGrand .ic-page svg { width: 30px; height: 30px; }
#reglagesGrand h1 { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.15; }
#reglagesGrand .titres p { margin: 3px 0 0; color: var(--doux); font-size: 15px; }
#reglagesGrand .tete .hh { margin-left: auto; font-size: 26px; font-weight: 600; color: #C9C4DD; }
#reglagesGrand #regCorps { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#reglagesGrand .pastilles-o { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px 62px; flex: none; }
#reglagesGrand .pastilles-o button { font-size: 14px; font-weight: 700; color: var(--doux); background: rgba(255,255,255,0.06); padding: 9px 18px; border-radius: 99px; transition: all 200ms ease; }
#reglagesGrand .pastilles-o button:hover, #reglagesGrand .pastilles-o button:focus { color: var(--texte); background: rgba(255,255,255,0.1); }
#reglagesGrand .pastilles-o button.oui { color: #0B0820; background: linear-gradient(90deg, var(--P), var(--S) 60%, var(--T)); box-shadow: 0 0 14px color-mix(in srgb, var(--S) 45%, transparent); }
/* le bord de plasma */
#reglagesGrand .plasma-bord, #reglagesGrand .plaque { position: relative; border-radius: 20px; background: var(--carte); isolation: isolate; }
#reglagesGrand .plasma-bord::before, #reglagesGrand .plaque::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--a-tour), var(--P), var(--S), var(--T), var(--P));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: tourneR 7s linear infinite paused; opacity: 0.4; transition: opacity 250ms ease; }
#reglagesGrand .plasma-bord::before { opacity: 1; animation-play-state: running; }
#reglagesGrand .plasma-bord::after, #reglagesGrand .plaque.oui::after, #reglagesGrand .plaque.f:focus-visible::after { content: ""; position: absolute; inset: -4px; border-radius: inherit; padding: 4px; pointer-events: none; z-index: -1; filter: blur(10px);
  background: conic-gradient(from var(--a-tour), var(--P), var(--S), var(--T), var(--P));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.4; }
#reglagesGrand .plaque.f:hover::before, #reglagesGrand .plaque.f:focus::before, #reglagesGrand .plaque.oui::before { opacity: 1; animation-play-state: running; }
#reglagesGrand .plaque.f:focus-visible { box-shadow: none; }
#reglagesGrand .reflet { position: absolute; left: 18px; right: 18px; top: 7px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.1); pointer-events: none; }
/* le module déplié : le module à gauche, le contenu à droite (lui seul défile, avec un fondu en bas) */
#reglagesGrand .deplie { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(250px, 0.8fr) 1.7fr; grid-template-rows: minmax(0, 1fr); gap: 24px; }
#reglagesGrand .module { align-self: start; padding: 24px 22px 22px; text-align: center; }
#reglagesGrand .module h3 { margin: 14px 0 4px; font-size: 22px; font-weight: 800; }
#reglagesGrand .module p { margin: 0 0 16px; color: var(--doux); line-height: 1.45; font-size: 14.5px; }
#reglagesGrand .grande-ic { width: 170px; height: 170px; margin: 4px auto 0; display: grid; place-items: center; position: relative; color: var(--P); }
#reglagesGrand .grande-ic svg { width: 92px; height: 92px; filter: drop-shadow(0 0 16px color-mix(in srgb, var(--P) 55%, transparent)); animation: flotte 4s ease-in-out infinite; }
#reglagesGrand .grande-ic::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--S) 50%, transparent); animation: tourne2 30s linear infinite; }
#reglagesGrand .apercu { width: 190px; height: 120px; margin: 8px auto 0; border-radius: 18px; background: var(--fondT); border: 1px solid var(--ligne); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#reglagesGrand .apercu .pts i { width: 22px; height: 22px; margin: 0 5px; }
#reglagesGrand .apercu img { max-height: 54px; max-width: 120px; }
#reglagesGrand .resume { display: grid; grid-template-columns: 1fr; gap: 8px; text-align: left; }
#reglagesGrand .resume div { padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); font-size: 13px; color: var(--doux); min-width: 0; }
#reglagesGrand .resume b { display: block; color: var(--texte); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#reglagesGrand .boutons-v { display: flex; flex-direction: column; gap: 10px; align-items: center; }
#reglagesGrand .contenu { min-height: 0; height: 100%; overflow-y: auto; padding: 4px 12px 30px 6px; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--ligne) transparent;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 26px), transparent); mask-image: linear-gradient(#000 calc(100% - 26px), transparent); }
/* les blocs */
#reglagesGrand .titre-bloc { margin: 22px 0 12px; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--doux); }
#reglagesGrand .contenu > .titre-bloc:first-child { margin-top: 4px; }
#reglagesGrand .texte { margin: 0 0 14px; color: var(--doux); font-size: 15px; line-height: 1.5; }
#reglagesGrand .note { margin: 4px 0 14px; padding: 12px 16px; border-radius: 14px; border: 1px dashed var(--ligne); color: var(--doux); font-size: 13.5px; line-height: 1.5; }
#reglagesGrand .info { margin: 2px 0 14px; color: var(--P); font-size: 14px; line-height: 1.45; }
#reglagesGrand .reglages { padding: 16px 18px; margin-bottom: 14px; }
#reglagesGrand .rang { display: flex; align-items: center; gap: 14px; }
#reglagesGrand .rang + .rang { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--ligne); }
#reglagesGrand .rang.col { flex-direction: column; align-items: flex-start; gap: 10px; }
#reglagesGrand .rang .txt { flex: 1; min-width: 0; } #reglagesGrand .rang .txt b { display: block; font-size: 15.5px; font-weight: 700; }
#reglagesGrand .rang .n { display: block; color: var(--doux); font-size: 13.5px; margin-top: 2px; line-height: 1.4; }
/* l'interrupteur de plasma */
#reglagesGrand .bascule { width: 52px; height: 30px; flex: none; border-radius: 99px; background: #1A1738; border: 1px solid var(--ligne); position: relative; transition: background 250ms ease; box-sizing: border-box; }
#reglagesGrand .bascule::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #CFCDE0; transition: transform 260ms cubic-bezier(.3, 1.4, .5, 1); }
#reglagesGrand .bascule.oui { border-color: transparent; background: linear-gradient(90deg, var(--P), var(--S), var(--T), var(--P)) 0 0 / 300% 100%; animation: coule 3s linear infinite; box-shadow: 0 0 12px color-mix(in srgb, var(--S) 55%, transparent); }
#reglagesGrand .bascule.oui::after { transform: translateX(22px); background: #fff; }
/* un choix en pilules, en cartes */
#reglagesGrand .choix-p { display: inline-flex; gap: 6px; padding: 5px; border-radius: 99px; background: #100D26; border: 1px solid var(--ligne); flex-wrap: wrap; }
#reglagesGrand .choix-p button { font-size: 14px; font-weight: 700; color: var(--doux); padding: 9px 16px; border-radius: 99px; }
#reglagesGrand .choix-p button:hover, #reglagesGrand .choix-p button:focus { color: var(--texte); }
#reglagesGrand .choix-p button.oui { color: #0B0820; background: linear-gradient(90deg, var(--P), var(--S) 60%, var(--T)); }
#reglagesGrand .cartes-choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
#reglagesGrand .carte-choix { padding: 14px 16px; text-align: left; } #reglagesGrand .carte-choix b { display: block; font-size: 16px; font-weight: 800; } #reglagesGrand .carte-choix span { display: block; color: var(--doux); font-size: 13px; margin-top: 3px; }
/* les cartes des thèmes, dans leurs propres couleurs */
#reglagesGrand .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
#reglagesGrand .theme { background: var(--fondT); padding: 12px 16px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
#reglagesGrand .theme .haut-t { display: flex; align-items: center; justify-content: space-between; height: 34px; }
#reglagesGrand .pts { display: inline-flex; } #reglagesGrand .pts i { width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; display: inline-block; }
#reglagesGrand .theme img { max-height: 34px; max-width: 52px; }
#reglagesGrand .theme b { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#reglagesGrand .theme small { color: var(--P); font-weight: 700; font-size: 12.5px; }
/* les thèmes perso installés : une ligne chacun, avec son bouton Supprimer */
#reglagesGrand .ligne .ic img { max-width: 32px; max-height: 32px; }
#reglagesGrand .ligne .btn { height: 38px; padding: 0 16px; font-size: 14px; flex: none; }
#reglagesGrand .ligne .btn:hover, #reglagesGrand .ligne .btn:focus { color: var(--rouge); border-color: var(--rouge); }
/* une ligne (appareil, version) */
#reglagesGrand .ligne { display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; min-height: 58px; padding: 9px 16px; margin-bottom: 8px; text-align: left; }
#reglagesGrand .ligne .txt { flex: 1; min-width: 0; } #reglagesGrand .ligne .txt b { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#reglagesGrand .ligne .n { display: block; color: var(--doux); font-size: 13.5px; margin-top: 2px; }
#reglagesGrand .ligne .fin { margin-left: auto; flex: none; white-space: nowrap; font-weight: 700; font-size: 14px; color: var(--doux); }
#reglagesGrand .ligne.oui .fin { color: var(--P); }
#reglagesGrand .ic { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,0.05); color: var(--a, var(--P)); }
#reglagesGrand .ic svg { width: 21px; height: 21px; } #reglagesGrand .ic .l { font-size: 19px; font-weight: 900; }
#reglagesGrand .etiquette { display: inline-block; font-size: 12.5px; font-weight: 800; padding: 4px 11px; border-radius: 99px; background: rgba(255,255,255,0.07); color: var(--doux); white-space: nowrap; }
#reglagesGrand .etiquette.ok { background: color-mix(in srgb, var(--vert) 13%, transparent); color: var(--vert); }
#reglagesGrand .etiquette.attention { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }

function remplirEcran() {
  const id = ouverte, a = id && APPLIS[id]; if (!a) return;   // (le menu en grand : remplirMenu)
  const texte = document.getElementById('voileTexte'), actions = document.getElementById('voileActions'), barre = document.getElementById('voileBarre');
  const m = a.maj, charge = m && m.etat !== 'dispo';
  let t, boutons = [], attente = false;
  if (charge) { t = a.installee ? `Mise à jour de ${a.nom}...` : `Installation de ${a.nom}...`; boutons = [['menu', 'Menu', 'second']]; }
  else if (!a.installee) { t = `${a.desc ? `${a.desc}\n\n` : ''}${a.nom} n'est pas encore installée.`; boutons = [['installer', `Installer ${a.nom}`, 'principal'], ['menu', 'Retirer la cartouche', 'second']]; }
  else if (demandeOuverture[id]) { t = `Ouverture de ${a.nom}...`; attente = true; }
  else if (m) { t = `Une nouvelle version de ${a.nom} est prête.`; boutons = [['maj', 'Mettre à jour', 'maj'], ['ouvrir', 'Ouvrir sans mettre à jour', 'second'], ['menu', 'Menu', 'second']]; }
  else { t = `${a.nom} est prête.`; boutons = [['ouvrir', `Ouvrir ${a.nom}`, 'principal'], ['menu', 'Menu', 'second']]; }
  const cleEcran = t + boutons.map((x) => x[0]).join();
  if (actions.dataset.cle !== cleEcran) {
    texte.textContent = t; actions.dataset.cle = cleEcran;
    actions.innerHTML = boutons.map(([f, txt, cls]) => `<button type="button" class="${cls}" data-f="${f}">${txt}</button>`).join('');
    if (zoome) actions.querySelector('button')?.focus();

  if (attente) {   // l'ouverture : la barre suit l'avancée donnée par Mindset ; prête, elle va au bout

  // l'appli ouverte est prête : elle prend la place de la console
  // (un court instant à 100 %, puis l'appli prend la place de la console)
  if (attente && zoome && pretes[id] && !plongee[id]) { plongee[id] = true; setTimeout(() => { plongee[id] = false; if (!demandeOuverture[id] || !pretes[id]) return; demandeOuverture[id] = false; hote('afficher', { id }); }, 400); }
}

  ouverte = MENU; voile.classList.add('menu'); document.getElementById('menuGrand').hidden = false;
  ouvrirMenuSur(listeMenu().length - 1); remplirMenu(false);

// Les flèches : d'un réglage à l'autre ; sur les onglets, gauche et droite changent d'onglet
function naviguerReglages(touche) {
  const f = document.activeElement, liste = [...elReg.querySelectorAll('.f')].filter((x) => x.offsetParent);

    const i = ONGLETS.findIndex((o) => o[0] === REG.onglet), n = ONGLETS[Math.max(0, Math.min(ONGLETS.length - 1, i + (touche === 'ArrowRight' ? 1 : -1)))];
    elRegCorps.querySelector(`[data-k="o:${n[0]}"]`)?.click(); return;

  const x = liste[i < 0 ? 0 : Math.max(0, Math.min(liste.length - 1, i + d))];
  if (x) { x.focus(); x.scrollIntoView({ block: 'nearest' }); sons.survol(); }
}
// Un geste : l'écran change tout de suite, Mindset règle puis renvoie l'état
elReg.addEventListener('pointerdown', (ev) => { if (ev.target.closest('[data-a="ok"]')) ev.preventDefault(); });   // (A garde le réglage visé)
elReg.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el || ouverte !== REGL || !zoome || occupe) return;
  const a = el.dataset.a, v = el.dataset.v ?? '', e = REG.etat;
  if (a === 'retour') { retourReglages(); return; }

    if (v !== REG.onglet && ONGLETS.some((o) => o[0] === v)) { sons.survol(); REG.onglet = v; remplirReglages(true); hote('reglage', { quoi: 'onglet', valeur: v }); }
    return;
  }

    hote('reglage', { quoi: a, valeur: oui, id: el.dataset.id || '' }); return;
  }

  if (e && a === 'animations') { e.apparence.animations = v; remplirReglages(); }

});
// Ce que Mindset envoie : l'état (e), l'onglet à ouvrir (ouvre les Paramètres), tout de suite ou non, les images des thèmes perso
function reglages(e, onglet, instant, images) {

  if (images && typeof images === 'object') { REG.images = images; REG.html = ''; }
  if (typeof onglet === 'string') { if (ONGLETS.some((o) => o[0] === onglet)) REG.onglet = onglet; afficherReglages(!!instant); return; }

}
function vitesseAnimations(v) { vitesse = v === 'express' || reduit ? 0.4 : 1; }

// ---------------------------------------------------------------- souris et clavier
const souris = new THREE.Vector2(9, 9), rayon = new THREE.Raycaster(); let vise = null, visConsole = false;
cv.addEventListener('pointermove', (e) => { const r = cv.getBoundingClientRect(); souris.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); });

// Les lettres A et B du clavier valent les boutons (A) OK et (B) Retour affichés en bas de l'écran (pas dans un champ)
const toucheManette = (e) => (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.ctrlKey || e.altKey || e.metaKey) ? e.key : ({ a: 'Enter', A: 'Enter', b: 'Escape', B: 'Escape' }[e.key] || e.key);

  const touche = toucheManette(e);

    if (touche === 'Enter' || e.key === ' ') { e.preventDefault(); if (!e.repeat) choisirDepuisMenu(listeMenu()[borne(Math.round(car.cible))]); return; }

// ---------------------------------------------------------------- les effets dessinés par-dessus le décor : pétales, ou lucioles la nuit
const ef = document.getElementById('effets'), fx = ef.getContext('2d');
const parts = Array.from({ length: 46 }, () => ({ u: Math.random(), v: Math.random(), s: 0.5 + Math.random(), ph: Math.random() * 6 }));
function effets(t) {
  const W = ef.clientWidth, H = ef.clientHeight, d = Math.min(devicePixelRatio, 2);
  if (ef.width !== Math.round(W * d)) { ef.width = Math.round(W * d); ef.height = Math.round(H * d); }
  fx.setTransform(d, 0, 0, d, 0, 0); fx.clearRect(0, 0, W, H);
  if (decor.effet === 'lucioles') {
    parts.forEach((q) => { const a = (q.u + Math.sin(t * 0.3 + q.ph) * 0.03) * W, b = (0.2 + q.v * 0.55 + Math.cos(t * 0.4 + q.ph) * 0.02) * H, k = 0.5 + Math.sin(t * 2 + q.ph * 3) * 0.5;
      const g = fx.createRadialGradient(a, b, 0, a, b, 7 * q.s); g.addColorStop(0, `rgba(255,240,150,${k})`); g.addColorStop(1, 'rgba(255,240,150,0)'); fx.fillStyle = g; fx.fillRect(a - 8, b - 8, 16, 16); });
    return;
  }
  parts.forEach((q) => { const a = ((q.u + t * 0.016 * q.s) % 1.2 - 0.1) * W + Math.sin(t * 1.5 + q.ph) * 16, b = ((q.v + t * 0.026 * q.s) % 1) * H;

}

// ---------------------------------------------------------------- la boucle : 30 images par seconde au repos, 60 pendant une animation ; rien en pause
let dernier = 0, dernierEcran = 0, enPause = false;
function image() {
  const t = performance.now() / 1000;

  const gardes = liste.filter((a) => { const p = Math.min(1, (t - a.t0) / Math.max(0.01, a.d)); a.maj(p); if (p >= 1) { a.fin?.(); return false; } return true; });

  visConsole = !hit && !occupe && !zoome && rayon.intersectObjects([ecran, corps], false).some((h) => h.object === ecran || (h.uv && h.object === corps));
  let nv = null; if (hit) { let o = hit.object; while (o && !nv) { nv = Object.values(carts).find((c) => c.g === o) || null; o = o.parent; } }

    c.g.position.set(c.repos.x, c.repos.y + Math.sin(t * 1.6 + c.phase) * 0.12 * c.echelleRepos + c.k * 0.25 * c.echelleRepos, c.repos.z);

  }

}
function pause() { if (!enPause) { enPause = true; renderer.setAnimationLoop(null); } }
function reprendre() { if (enPause) { enPause = false; renderer.setAnimationLoop(image); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); else reprendre(); });
addEventListener('resize', () => { poser(); if (zoome) origineZoom(); });
// le décor change tout seul quand le moment de la journée change
setInterval(() => { const m = momentDuJour(); if (m !== nomDecor && !zoome && !occupe) { nomDecor = m; decor = DECORS[m]; montrerDecor(); poser(); } }, 60000);

// ---------------------------------------------------------------- ce que Mindset peut demander
function etat(e) {
  if (!e || !Array.isArray(e.applis)) return;
  const nouvelles = {};
  for (const a of e.applis) {
    if (typeof a.id !== 'string' || !/^[a-z0-9-]{1,30}$/.test(a.id)) continue;
    nouvelles[a.id] = { nom: String(a.nom || a.id).slice(0, 30), c: /^#[0-9A-Fa-f]{6}$/.test(a.c1) ? a.c1 : '#00E5FF',
      desc: String(a.desc || '').slice(0, 300), installee: !!a.installee, etat: ['ferme', 'ouvert', 'fond'].includes(a.etat) ? a.etat : 'ferme',
      maj: a.maj && ['dispo', 'telechargement', 'installation'].includes(a.maj.etat) ? { etat: a.maj.etat, progres: Number(a.maj.progres) || 0 } : null };
  }
  const avant = APPLIS; APPLIS = nouvelles; TUILES = e.applis.map((a) => a.id).filter((id) => APPLIS[id]);
  for (const a of e.applis) if (APPLIS[a.id]) chargerLogo(a.id, typeof a.logo === 'string' && /^(logos\/|https:\/\/applogos\.mindset\.local\/)[a-z0-9-]+\.png$/.test(a.logo) ? a.logo : null);
  for (const id of Object.keys(carts)) if (!APPLIS[id] && enFente !== id) retirerCartouche(id);

  poser();

  if (enFente && !occupe && !zoome && (!APPLIS[enFente] || APPLIS[enFente].etat === 'ferme')) { const c = carts[enFente]; occupe = true; ejecter(c, () => { occupe = false; }); }
  if (zoome && ouverte === MENU) remplirMenu(false); else if (zoome) remplirEcran();
}
// Mindset a lancé l'appli (après « ouvrir ») : si la cartouche n'est pas déjà en route, on joue l'insertion
function jouerOuverture(id) { if (!carts[id] || occupe || zoome || enFente === id && ouverte === id) return; demandeOuverture[id] = true; inserer(carts[id]); }
function appliPrete(id) { pretes[id] = true; if (zoome) remplirEcran(); }
function avancee(id, p) { chargement[id] = Math.max(chargement[id] || 0, +p || 0); if (zoome && ouverte === id) remplirEcran(); }
const plongee = {};
// Retour d'une appli (bouton Menu de Mindset, ou appli fermée) : la caméra ressort de l'écran ; ejecter : la cartouche ressort
function jouerRetour(id, ejecter) {

  const fin = () => { if (ejecter || APPLIS[id]?.etat === 'ferme') { occupe = true; window.setTimeout(() => ejecterMaintenant(id), 50); } };
  if (!zoome) {   // (vue rouverte : on repart de l'intérieur de l'écran)
    if (enFente !== id) placerEnFente(id);
    origineZoom(); plan.style.transform = `scale(${1 + ZOOM})`; voile.style.opacity = 0; zoome = true; ouverte = id;
  }

}
function ejecterMaintenant(id) { const c = carts[id]; if (c && enFente === id) ejecter(c, () => { occupe = false; }); else occupe = false; }
function jouerEjection(id) {
  if (enFente !== id || occupe) return;
  if (zoome && (ouverte === MENU || ouverte === REGL)) {   // (dans le menu en grand ou les Paramètres : la cartouche retourne à sa place sans qu'on ressorte)
    const c = carts[id]; enFente = null; demarrage = 0;
    if (c) { c.etat = 'repos'; c.g.rotation.set(0, 0, 0); c.g.position.copy(c.repos); c.g.scale.setScalar(c.echelleRepos); }
    if (ouverte === MENU) remplirMenu(false); return;
  }
  if (zoome) dezoomer(() => { occupe = true; ejecterMaintenant(id); }); else { occupe = true; ejecterMaintenant(id); } }
let minuteBulle = 0;
function message(texte) { const b = document.getElementById('bulle'); b.textContent = String(texte).slice(0, 80); b.classList.add('vu'); clearTimeout(minuteBulle); minuteBulle = setTimeout(() => b.classList.remove('vu'), 2400); }
window.mindset = { etat, pause, reprendre, message, jouerOuverture, jouerRetour, jouerMenu, jouerEjection, appliPrete, avancee, reglages, vitesse: vitesseAnimations };
// (pour les essais automatiques : glisser simule un geste de souris sur la rangée, de dx pixels en ms millisecondes)
const glisserEssai = (dx, ms = 250) => { const r = elCar.getBoundingClientRect(), x0 = r.left + r.width / 2, y = r.top + r.height / 2, n = 12, ev = (t, x) => new PointerEvent(t, { clientX: x, clientY: y, button: 0, pointerId: 1, bubbles: true, pointerType: 'mouse' });
  elCar.dispatchEvent(ev('pointerdown', x0)); for (let k = 1; k <= n; k++) setTimeout(() => { elCar.dispatchEvent(ev('pointermove', x0 + dx * k / n)); if (k === n) elCar.dispatchEvent(ev('pointerup', x0 + dx)); }, ms * k / n); };
window.mindsetEssai = { choisirCartouche, zoomerMenu, choisirDepuisMenu, glisser: glisserEssai, touche: (key) => dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true })),
  cliquerTuile: (i) => { const bs = elCar.querySelectorAll('button'), b = bs[i < 0 ? bs.length + i : i], r = b?.getBoundingClientRect(); if (!r) return; const o = { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, button: 0, pointerId: 1, bubbles: true }; b.dispatchEvent(new PointerEvent('pointerdown', o)); elCar.dispatchEvent(new PointerEvent('pointerup', o)); },
  cliquer: (f) => document.querySelector(`#voileActions button[data-f="${f}"]`)?.click(), etatScene: () => ({ enFente, zoome, occupe, ouverte, menuSel, pos: +car.pos.toFixed(2), tuile: ouverte === MENU ? listeMenu()[menuSel] : null, onglet: ouverte === REGL ? REG.onglet : null, vitesse }),
  reglage: (k) => elReg.querySelector(`[data-k="${CSS.escape(k)}"]`)?.click(), viser: (k) => elReg.querySelector(`[data-k="${CSS.escape(k)}"]`)?.focus(),
  defiler: (y) => { const c = elReg.querySelector('.contenu'); if (c) c.scrollTop = y; } };   // (pour les essais automatiques)

// ---------------------------------------------------------------- le thème perso (bloc « Console »), une fois au démarrage
const urlTheme = (u) => typeof u === 'string' && /^https:\/\/theme\.mindset\.local\/[\w.%()-]{1,240}$/.test(u) ? u : '';
// une image sans transparence (photo, GIF de film) : en vignette arrondie
function opaque(im) {
  try { const c = document.createElement('canvas'); c.width = c.height = 24; const k = c.getContext('2d', { willReadFrequently: true }); k.drawImage(im, 0, 0, 24, 24); const d = k.getImageData(0, 0, 24, 24).data; for (let i = 3; i < d.length; i += 4) if (d[i] < 245) return false; return true; } catch (e) { return false; }
}
function appliquerTheme() {
  if (!THEME) return;
  const fondT = urlTheme(THEME.fond);
  if (fondT) { voile.classList.add('avecFond'); voile.style.setProperty('--fondTheme', `url("${fondT}")`); voile.style.setProperty('--fondOpacite', String(Math.min(1, Math.max(0.05, +THEME.opacite || 0.35)))); }
  const masc = urlTheme(THEME.mascotte), elM = document.getElementById('mascotte');
  if (masc) { elM.crossOrigin = 'anonymous'; elM.onload = () => { elM.classList.toggle('flotte', !THEME.mascotteAnimee); elM.classList.toggle('vignette', opaque(elM)); elM.hidden = false; }; elM.src = masc; }
  const ch = urlTheme(THEME.chargement);
  if (ch) { const im = document.getElementById('voileCharge'); im.src = ch; im.classList.toggle('tourne', THEME.effet === 'tourne'); document.getElementById('voileBarre').classList.add('avecImage'); }
  const logo = urlTheme(THEME.logo); if (logo) { chargerLogo('mindset', logo); animerLogo('mindset', logo); }
  const pol = urlTheme(THEME.police);
  if (pol) { try { new FontFace('PoliceTheme', `url("${pol}")`).load().then((f) => { document.fonts.add(f); document.body.classList.add('policeTheme'); }).catch(() => {}); } catch (e) {} }
}
appliquerTheme();
montrerDecor(); poser();
renderer.setAnimationLoop(image);
hote('pret');
