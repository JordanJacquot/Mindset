# Construction d'une version de Mindset sur GitHub, depuis le dépôt (jamais depuis un PC), puis signature
# Authenticode gratuite par SignPath Foundation (issue #4).
#
# Déroulé :
#   1. « construire » : compile Mindset.exe (outils\construire.ps1) et dépose le dossier Mindset comme artefact.
#   2. « signer » : seulement quand la variable SIGNPATH_ACTIVE vaut true (Settings > Secrets and variables >
#      Actions > Variables). Envoie l'artefact à SignPath, attend l'approbation manuelle de Jordan dans SignPath,
#      vérifie les signatures, puis dépose Mindset.zip (signé) comme artefact.
#   3. Ce workflow ne publie rien. Aujourd'hui, outils\publier.ps1 publie le Mindset.zip construit sur le PC de Jordan
#      (release\Mindset.zip), avec sa signature RSA (Mindset.zip.sig, clé privée qui ne quitte jamais le PC) : il ne
#      récupère PAS l'artefact de ce workflow, et les exe publiés ne sont donc pas signés Authenticode. Le jour où
#      SignPath sera actif, publier.ps1 devra télécharger le Mindset.zip signé ici avant de faire sa signature RSA
#      (voir CODE_SIGNING.md).
#   0. « rust » (passage en Rust, plan 3.6), seulement si rust\mindset-installateur ou rust\desinstalleur existe :
#      construit MindsetInstallateur.exe et « Desinstaller Mindset.exe » en Rust (cargo build --release --locked, sans
#      l'option « essai » du désinstalleur), contrôle leurs imports (aucun runtime C à part) et leur fiche de version,
#      les atteste (attestation GitHub : ce dépôt, ce fichier de construction, ce commit) et les dépose comme artefact
#      « Mindset-rust ». « construire » les met dans le dossier Mindset (le désinstalleur à la place de celui en C#), et
#      outils\publier.ps1 (outils\exe-rust.ps1) les récupère et vérifie leur attestation avant de faire et signer le zip :
#        gh attestation verify <exe> --repo JordanJacquot/Mindset
#          --signer-workflow JordanJacquot/Mindset/.github/workflows/release.yml --source-digest <commit publié>
#      Sans dossier rust, ce job ne fait rien et le reste est inchangé.
#
# Rien ici n'utilise la clé RSA de la suite : elle ne doit jamais aller sur GitHub.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rust:
    name: "Programmes en Rust (MindsetInstallateur.exe, Desinstaller Mindset.exe ; seulement si leur dossier rust existe)"
    runs-on: windows-latest
    # (le jeton OIDC et l'écriture d'attestations : seulement pour ce job)
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    env:
      CARGO_TERM_COLOR: never
    outputs:
      present: ${{ steps.rust.outputs.present }}
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Y a-t-il des programmes en Rust ? (rust/mindset-installateur, rust/desinstalleur)"
        id: rust
        run: |
          $inst = Test-Path -LiteralPath 'rust\mindset-installateur\Cargo.toml'
          $desinst = Test-Path -LiteralPath 'rust\desinstalleur\Cargo.toml'
          $present = $inst -or $desinst
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "present=$($present.ToString().ToLower())`ninstallateur=$($inst.ToString().ToLower())`ndesinstalleur=$($desinst.ToString().ToLower())`n")
          Write-Host "MindsetInstallateur.exe en Rust : $inst ; désinstalleur en Rust : $desinst"

      - name: "Rust 1.99.1, la version figée par rust/rust-toolchain.toml"
        if: ${{ steps.rust.outputs.present == 'true' }}
        working-directory: rust
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Construire MindsetInstallateur.exe (cargo build --release --locked)"
        if: ${{ steps.rust.outputs.installateur == 'true' }}
        working-directory: rust
        run: |
          cargo build --release --locked -p mindset-installateur
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force -Path '..\_ci\rust' | Out-Null
          Copy-Item -LiteralPath 'target\release\MindsetInstallateur.exe' -Destination '..\_ci\rust\MindsetInstallateur.exe'

      # (sans l'option « essai » : l'exe livré ne connaît ni -Test ni -EssaiFenetre)
      - name: "Construire le désinstalleur (cargo build --release --locked, sans l'option essai)"
        if: ${{ steps.rust.outputs.desinstalleur == 'true' }}
        working-directory: rust
        run: |
          cargo build --release --locked -p desinstalleur
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force -Path '..\_ci\rust' | Out-Null
          Copy-Item -LiteralPath 'target\release\desinstaller-mindset.exe' -Destination '..\_ci\rust\Desinstaller Mindset.exe'

      - name: "Aucun runtime C à part (VCRUNTIME*.dll, MSVCP*.dll), fiche de version, sinon refusé"
        if: ${{ steps.rust.outputs.present == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exes = @(Get-ChildItem -LiteralPath '_ci\rust' -File)
          .\outils\verifier-imports.ps1 -Liste -Fichiers @($exes | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE) { exit 1 }
          # La fiche de version : produit « Mindset », version de Mindset.ps1 (le désinstalleur la lit à la construction)
          $ps1 = [IO.File]::ReadAllText('Mindset\fichiers\Mindset.ps1', [Text.Encoding]::UTF8)
          if ($ps1 -notmatch "(?m)^\`$AppVersion = '(\d+(\.\d+){1,3})'") { throw 'Numéro de version introuvable dans Mindset.ps1' }
          $p = @($Matches[1].Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          foreach ($f in $exes) {
            $i = $f.VersionInfo
            Write-Host "$($f.Name) : produit « $($i.ProductName) », version du produit « $($i.ProductVersion) »"
            if ($f.Name -eq 'Desinstaller Mindset.exe' -or $i.ProductName) {
              if ($i.ProductName -ne 'Mindset') { throw "Nom de produit inattendu pour $($f.Name) : $($i.ProductName)" }
              if ($i.ProductVersion -ne $v4) { throw "$($f.Name) porte la version $($i.ProductVersion) au lieu de $v4 (Mindset.ps1)" }
            } else {
              Write-Host "::warning::$($f.Name) n'a pas de fiche de version."
            }
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$($f.Name) (Rust, non signé, commit $env:GITHUB_SHA) : SHA-256 ``$((Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash)``" + "`n")
          }

      # L'attestation que outils\publier.ps1 vérifie (outils\exe-rust.ps1 : gh attestation verify --repo
      # JordanJacquot/Mindset --signer-workflow JordanJacquot/Mindset/.github/workflows/release.yml --source-digest <commit>)
      - name: "Attester les programmes en Rust (ce dépôt, ce fichier de construction, ce commit)"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _ci/rust/*

      - name: "Déposer les programmes en Rust"
        if: ${{ steps.rust.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mindset-rust
          path: _ci/rust/
          if-no-files-found: error
          retention-days: 30

  construire:
    name: "Construire Mindset"
    needs: rust
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
      artifact-id: ${{ steps.depot.outputs.artifact-id }}
    steps:
      - name: "Récupérer le dépôt"
        uses: actions/checkout@v4

      - name: "Numéro de version"
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = [IO.File]::ReadAllText('Mindset\fichiers\Mindset.ps1', [Text.Encoding]::UTF8)
          if ($ps1 -notmatch "(?m)^\`$AppVersion = '(\d+(\.\d+){1,3})'") { throw 'Numéro de version introuvable dans Mindset.ps1' }
          $v = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à la version de Mindset.ps1 ($v)."
          }
          $p = @($v.Split('.')); while ($p.Count -lt 4) { $p += '0' }
          $v4 = $p -join '.'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$v`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version4=$v4`n")
          Write-Host "Version $v ($v4)"

      - name: "Construire (outils\\construire.ps1)"
        run: |
          $ErrorActionPreference = 'Stop'
          .\outils\construire.ps1

      - name: "Récupérer les programmes en Rust (job rust de ce run)"
        if: ${{ needs.rust.outputs.present == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mindset-rust
          path: _ci/rust

      - name: "Les programmes en Rust dans le dossier (MindsetInstallateur.exe, le désinstalleur à la place de celui en C#)"
        if: ${{ needs.rust.outputs.present == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem -LiteralPath '_ci\rust' -File) {
            Copy-Item -LiteralPath $f.FullName -Destination (Join-Path 'Mindset' $f.Name) -Force
            Write-Host "$($f.Name) : Rust, SHA-256 $((Get-FileHash -LiteralPath (Join-Path 'Mindset' $f.Name) -Algorithm SHA256).Hash)"
          }

      - name: "Vérifier Mindset.exe"
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item -LiteralPath 'Mindset\Mindset.exe'
          $i = $exe.VersionInfo
          Write-Host "Produit : $($i.ProductName), version du produit : $($i.ProductVersion), version du fichier : $($i.FileVersion)"
          if ($i.ProductName -ne 'Mindset') { throw "Nom de produit inattendu : $($i.ProductName)" }
          if ($i.ProductVersion -ne '${{ steps.version.outputs.version4 }}') {
            Write-Host "::warning::La version de Mindset.exe ($($i.ProductVersion)) n'est pas ${{ steps.version.outputs.version4 }} : lanceur.cs n'a pas été mis à jour par publier.ps1."
          }
          $h = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Mindset.exe (non signé) : SHA-256 ``$h``" + "`n")
          # Le désinstalleur autonome est signé lui aussi (issue #1) : même produit, même version
          $d = Get-Item -LiteralPath 'Mindset\Desinstaller Mindset.exe'
          if ($d.VersionInfo.ProductName -ne 'Mindset') { throw "Nom de produit inattendu pour le désinstalleur : $($d.VersionInfo.ProductName)" }
          if ($d.VersionInfo.ProductVersion -ne $i.ProductVersion) { throw "Le désinstalleur ($($d.VersionInfo.ProductVersion)) n'a pas la version de Mindset.exe ($($i.ProductVersion))" }
          # Avec rust\mindset-installateur : MindsetInstallateur.exe est dans le dossier (le relais installer-admin.ps1 le lance)
          if ((Test-Path -LiteralPath 'rust\mindset-installateur\Cargo.toml') -and -not (Test-Path -LiteralPath 'Mindset\MindsetInstallateur.exe')) { throw 'MindsetInstallateur.exe absent du dossier Mindset' }
          # Aucun programme livré ne doit avoir besoin d'un runtime C à installer à part (VCRUNTIME)
          .\outils\verifier-imports.ps1 -Fichiers @(Get-ChildItem -LiteralPath 'Mindset' -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE) { exit 1 }

      - name: "Préparer le dossier à signer"
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = '_ci\a-signer'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath 'Mindset' -Destination $dest -Recurse
          Get-ChildItem -LiteralPath $dest -Recurse -File | Measure-Object | ForEach-Object { Write-Host "$($_.Count) fichiers" }

      # L'artefact contient un seul dossier « Mindset » (Mindset.exe, LISEZMOI.txt, fichiers\...).
      # SignPath vérifie qu'il vient bien de ce workflow (origin verification).
      - name: "Déposer l'artefact non signé"
        id: depot
        uses: actions/upload-artifact@v7
        with:
          name: Mindset-non-signe
          path: _ci/a-signer
          if-no-files-found: error
          retention-days: 7

  signer:
    name: "Signer avec SignPath"
    needs: construire
    if: ${{ vars.SIGNPATH_ACTIVE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: "Vérifier la configuration SignPath"
        env:
          JETON: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANISATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not $env:JETON) { Write-Host '::error::Le secret SIGNPATH_API_TOKEN est absent.'; exit 1 }
          if (-not $env:ORGANISATION) { Write-Host '::error::La variable SIGNPATH_ORGANIZATION_ID est absente.'; exit 1 }
          Write-Host 'Configuration SignPath présente.'

      # La demande attend l'approbation manuelle de Jordan dans SignPath (politique « release-signing »).
      - name: "Demande de signature (approbation manuelle dans SignPath)"
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Mindset' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ needs.construire.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: _ci/signe
          parameters: |
            version: "${{ needs.construire.outputs.version4 }}"

      - name: "Vérifier les signatures"
        run: |
          $ErrorActionPreference = 'Stop'
          $racine = '_ci\signe\Mindset'
          foreach ($e in 'Mindset.exe', 'Desinstaller Mindset.exe') { if (-not (Test-Path -LiteralPath "$racine\$e")) { throw "Dossier signé inattendu : $racine\$e absent" } }
          $problemes = @()
          # (tous les exe du dossier : Mindset.exe, le désinstalleur, et MindsetInstallateur.exe avec rust\mindset-installateur)
          $nos = @(Get-ChildItem -LiteralPath $racine -Filter '*.exe' -File) + @(Get-ChildItem -LiteralPath $racine -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($f in $nos) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'SignPath Foundation') { $problemes += "$($f.FullName) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          # Les DLL de Microsoft gardent leur propre signature (jamais signées par nous)
          foreach ($f in @(Get-ChildItem -LiteralPath "$racine\fichiers\lib\webview2" -Filter '*.dll')) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(,|$)') { $problemes += "$($f.Name) : $($s.Status) $($s.SignerCertificate.Subject)" }
          }
          if ($problemes) { $problemes | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "$($nos.Count) fichiers signés par SignPath Foundation, DLL de Microsoft intactes."

      - name: "Construire Mindset.zip (signé)"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '_ci\sortie' | Out-Null
          $zip = '_ci\sortie\Mindset.zip'
          Compress-Archive -Path '_ci\signe\Mindset' -DestinationPath $zip -Force
          $h = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          "$h  Mindset.zip" | Out-File -FilePath '_ci\sortie\Mindset.zip.sha256' -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Mindset.zip (signé par SignPath) : SHA-256 ``$h``" + "`n")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Demande SignPath : ${{ steps.signpath.outputs.signing-request-web-url }}" + "`n")

      # Récupéré ensuite par outils\publier.ps1 sur le PC de Jordan (signature RSA et Release)
      - name: "Déposer Mindset.zip signé"
        uses: actions/upload-artifact@v7
        with:
          name: Mindset-zip-signe
          path: _ci/sortie
          if-no-files-found: error
          retention-days: 30
