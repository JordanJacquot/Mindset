# Le changement de nom de Nevermind (ancien nom : OptiGame) essayé en vrai sur la machine jetable de GitHub : vraie
# version publiée de Nevermind, vraie Release de Mindset 2.12.0, vraie installation dans Program Files. Lancé à la main
# seulement (gh workflow run renommage-reel.yml).
# Tout le code est dans outils\essai-renommage-reel.ps1 (UTF-8 avec BOM : un nom accentué écrit ici arriverait abîmé).
name: Renommage de Nevermind en vrai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: "Mindset nouveau et Mindset 2.12.0 face à Nevermind sous ses deux noms (Nevermind, OptiGame)"
        run: .\outils\essai-renommage-reel.ps1
