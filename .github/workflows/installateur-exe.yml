# MindsetInstallateur.exe, le mini-installateur de Mindset en Rust, construit sur GitHub (jamais sur un PC), avec son
# attestation de provenance (plan Rust, 3.6). C'est lui qui va dans Mindset.zip, à côté de Mindset.exe : publier.ps1
# le récupère depuis ce workflow pour le commit publié, et vérifie son attestation (bon dépôt, ce fichier de
# construction, ce commit) avant de faire le zip et de le signer :
#   gh attestation verify MindsetInstallateur.exe --repo JordanJacquot/Mindset
#     --signer-workflow JordanJacquot/Mindset/.github/workflows/installateur-exe.yml --source-digest <commit publié>
# Rien ici n'utilise la clé RSA de la suite.
name: Installateur Rust

on:
  push:
    tags:
      - 'v*'
    # (essai provisoire sur la branche de travail, à retirer)
    branches:
      - rust-2-installateur
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
        working-directory: rust
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Rust 1.99.1, la version figée par rust/rust-toolchain.toml"
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }

      - name: "Le corpus cas\\installateur (cargo test)"
        run: cargo test --locked -p mindset-installateur

      - name: "Construction (cargo build --release --locked)"
        run: |
          cargo build --release --locked -p mindset-installateur
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force -Path '..\_ci\installateur' | Out-Null
          Copy-Item -LiteralPath 'target\release\MindsetInstallateur.exe' -Destination '..\_ci\installateur\'
          $h = (Get-FileHash -LiteralPath '..\_ci\installateur\MindsetInstallateur.exe' -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "MindsetInstallateur.exe (commit $env:GITHUB_SHA) : SHA-256 ``$h``" + "`n")

      - name: "Attestation de provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _ci/installateur/MindsetInstallateur.exe

      - name: "Déposer MindsetInstallateur.exe"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MindsetInstallateur
          path: _ci/installateur/MindsetInstallateur.exe
          if-no-files-found: error
          retention-days: 30
