name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Analyse du code (PSScriptAnalyzer, erreurs seulement)
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            # (la galerie PowerShell répond parfois mal : jusqu'à 3 essais)
            for ($n = 1; $n -le 3; $n++) {
              try { Install-Module PSScriptAnalyzer -Repository PSGallery -Force -Scope CurrentUser; break }
              catch { if ($n -eq 3) { throw }; Start-Sleep -Seconds 15 }
            }
          }
          $erreurs = @(Invoke-ScriptAnalyzer -Path Mindset -Recurse -Severity Error)
          $erreurs | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 300 | Write-Host
          if ($erreurs.Count) { Write-Host "$($erreurs.Count) erreur(s) trouvée(s) par PSScriptAnalyzer."; exit 1 }
          Write-Host 'Aucune erreur.'

      - name: Vérifications (syntaxe, fenêtre, tirets, encodage, licence)
        run: .\outils\verifier.ps1

      - name: Tests de sécurité (signature, installation des zips, dossiers acceptés)
        run: .\outils\tester-securite.ps1

      - name: "Fichiers de données jamais perdus (écriture sûre, fichier abîmé, copie .bak, réglage coupé qui reste coupé)"
        run: .\outils\tester-donnees.ps1

      - name: "Tests du désinstalleur (faux environnement, sans droits)"
        run: .\outils\tester-desinstallation.ps1

      - name: "Refus du mini-installateur administrateur (faux PC, sans droits)"
        run: .\outils\tester-installer.ps1

      - name: "Mindset face à son mini-installateur : tâche SYSTEM, demande de Windows si elle ne répond pas, ancienne tâche remplacée (faux Windows, sans droits)"
        run: .\outils\tester-mini-installateur.ps1

      - name: "Programmes trouvés par leur chemin, jamais par leur nom (vrais programmes d'essai, sans droits)"
        run: .\outils\tester-processus.ps1

      - name: "Nom de chaque appli dans la barre des tâches (faux menu Démarrer, fenêtre de test hors de l'écran)"
        run: .\outils\tester-raccourcis.ps1

      - name: "Démarrage des applis, mises à jour (et leur carte dans la console) et filet contre les plantages (faux PC, Mindset de test hors de l'écran)"
        run: .\outils\tester-mises-a-jour.ps1

      - name: "Retour de Mindset après une mise à jour, bulles près de l'horloge, message de mise à jour bloquée, appli gardée pendant une opération (faux PC, Mindset de test sans fenêtre)"
        run: .\outils\tester-maj-demarrage.ps1

      - name: "Journaux et restes (journal des plantages de Mindset.exe, thème réimporté jamais abîmé, fausses lignes du journal, ancien console-webview ; faux PC)"
        run: .\outils\tester-journaux.ps1

      - name: "Fenêtre dans l'écran (125 %, 150 %, 1366 x 768), Mindset caché sans processeur, dossier de travail libre, console 3D qui survit à un incident de WebView2 (écrans simulés, Mindset de test hors de l'écran)"
        run: .\outils\tester-fenetre-console.ps1

      - name: "Mindset ouvert en administrateur par un Explorateur administrateur : une seule relance, jamais en boucle (faux Windows)"
        run: .\outils\tester-bascule-admin.ps1
