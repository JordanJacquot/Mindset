# Le mini-installateur essayé en vrai sur la machine jetable de GitHub (vraies tâches planifiées, vrais comptes Windows,
# vraie installation de Mindset). Lancé à la main seulement (gh workflow run installateur-reel.yml).
# Tout le code est dans outils\essai-installateur-reel.ps1 (UTF-8 avec BOM : un nom accentué écrit ici arriverait abîmé).
name: Installateur en vrai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: "0. Préparation (Mindset construit, clé de TEST, zips signés, Releases v2.9.0 et v2.7.0)"
        run: .\outils\essai-installateur-reel.ps1 -Cas 0

      - name: "1. Installation sur C:, puis sur D:\\Mindset, puis une demande par la tâche SYSTEM"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 1

      - name: "2. Mise à jour depuis v2.9.0 : l'ancienne tâche remplacée par la tâche SYSTEM"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 2

      - name: "3. Mise à jour depuis v2.7.0"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 3

      - name: "4. Mise à jour avec Mindset caché sur runneradmin : relancé dans sa session, sans boucle"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 4

      - name: "5. Compte standard au nom accentué, installé par un administrateur"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 5

      - name: "6. Le compte standard lit et lance la tâche, sa demande passe"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 6

      - name: "7. Deux comptes standard : seuls les programmes du bon compte sont fermés"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 7

      - name: "8. Tâche SYSTEM absente, désactivée ou cassée : la demande de Windows, jamais l'ancienne tâche"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 8

      - name: "9. Désinstallation : plus aucune tâche \\Mindset\\"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 9

      - name: "10. La tâche SYSTEM ne voit pas l'environnement de l'utilisateur (contre-épreuve sous son compte)"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 10
