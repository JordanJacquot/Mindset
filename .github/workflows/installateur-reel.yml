# Le mini-installateur essayé en vrai sur la machine jetable de GitHub (vraies tâches planifiées, vrais comptes Windows,
# vraie installation de Mindset). Lancé à la main seulement (gh workflow run installateur-reel.yml).
# Depuis l'étape 2 du passage en Rust : MindsetInstallateur.exe est construit d'abord, dans ce même run, puis mis à côté
# de Mindset.exe dans la copie d'essai ; installer-admin.ps1 n'est plus qu'un relais vers lui.
# Tout le code est dans outils\essai-installateur-reel.ps1 (UTF-8 avec BOM : un nom accentué écrit ici arriverait abîmé).
name: Installateur en vrai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Construire MindsetInstallateur.exe (Rust 1.99.1, bibliothèques figées par Cargo.lock)"
        working-directory: rust
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { rustup show; if ($LASTEXITCODE) { exit 1 } }
          if ((rustc --version) -notmatch '^rustc 1\.99\.1 ') { Write-Host 'Mauvaise version de Rust.'; exit 1 }
          cargo build --release --locked -p mindset-installateur
          if ($LASTEXITCODE) { exit 1 }
          $exe = (Resolve-Path 'target\release\MindsetInstallateur.exe').Path
          $h = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "MindsetInstallateur.exe : SHA-256 $h"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "MINDSET_INSTALLATEUR=$exe`n")

      - name: "0. Préparation (Mindset construit avec MindsetInstallateur.exe, clé de TEST, zips signés, Releases v2.14.0, v2.11.0, v2.9.0 et v2.7.0)"
        run: .\outils\essai-installateur-reel.ps1 -Cas 0

      - name: "1. Installation sur C:, puis sur D:\\Mindset, puis une demande par la tâche SYSTEM"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 1

      - name: "2. Mise à jour depuis v2.9.0 : l'ancienne tâche remplacée par la tâche SYSTEM"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 2

      - name: "3. Mise à jour depuis v2.7.0"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 3

      - name: "4. Mise à jour avec Mindset caché sur runneradmin : relancé dans sa session, sans boucle"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 4

      - name: "5. Compte standard au nom accentué, installé par un administrateur"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 5

      - name: "6. Le compte standard lit et lance la tâche, sa demande passe"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 6

      - name: "7. Deux comptes standard : seuls les programmes du bon compte sont fermés"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 7

      - name: "8. Tâche SYSTEM absente, désactivée ou cassée : la demande de Windows, jamais l'ancienne tâche"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 8

      - name: "9. Désinstallation : plus aucune tâche \\Mindset\\"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 9

      - name: "10. La tâche SYSTEM ne voit pas l'environnement de l'utilisateur (contre-épreuve sous son compte)"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 10

      - name: "11. Mise à jour directe depuis v2.11.0 : la partie administrateur repasse en SYSTEM"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 11

      - name: "12. Compte standard malveillant : C:\\Mindset\\Programmes, ancienne version, partie administrateur, tout refusé"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 12

      - name: "13. Variable COR_* dans HKCU\\Environment : pas de demande de Windows"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 13

      - name: "14. Mise à jour depuis v2.14.0 (dernière version PowerShell) : bascule vers MindsetInstallateur.exe"
        if: ${{ !cancelled() }}
        run: .\outils\essai-installateur-reel.ps1 -Cas 14
